# =============================================================================
# SMART CLIMATE TRANSITION - PARAMETERIZED SCRIPT CONSOLIDATION
# =============================================================================
# Consolidates 4 individual transition scripts into single parameterized script
# Gulf Coast optimized for League City, TX climate with ML14XC1/E130 coordination
# Professional-grade operation maintaining $548/year energy savings progress
# =============================================================================

smart_climate_transition:
  alias: "Smart Climate Transition"
  description: "Unified climate transition script for all occupancy modes"
  mode: restart  # Ensures single transition active, allows immediate mode changes
  fields:
    preset:
      name: "Transition Preset"
      description: "Climate transition preset: away, guest, home, sleep"
      required: true
      selector:
        select:
          options:
            - "away"
            - "guest"
            - "home"
            - "sleep"
  
  sequence:
    # =======================================================================
    # PHASE 1: VALIDATION AND PARAMETER SETUP
    # =======================================================================
    
    # Validate preset parameter
    - condition: template
      value_template: "{{ preset in ['away', 'guest', 'home', 'sleep'] }}"
      
    # Check equipment availability
    - condition: template
      value_template: "{{ not is_state('climate.thermostat', 'unavailable') }}"
      
    # Check for equipment locks (safety)
    - condition: template
      value_template: "{{ not is_state('input_boolean.hvac_equipment_lock', 'on') }}"
      
    # Log transition start
    - service: logbook.log
      data:
        name: "Smart Climate Transition"
        message: "{{ preset.title() }} mode transition starting - Gulf Coast optimization"
        entity_id: climate.thermostat
        
    # =======================================================================
    # PHASE 2: PROFILE CONFIGURATION AND VARIABLES
    # =======================================================================
    
    - variables:
        # Enhanced sleep temperature calculation with outdoor conditions
        sleep_temp: >
          {% set hour = now().hour %}
          {% set outdoor_temp = state_attr('weather.forecast_home', 'temperature') | float(75) %}
          {% if 22 <= hour < 23 %}
            {% if outdoor_temp > 90 %}71{% else %}72{% endif %}
          {% elif hour >= 23 or hour < 2 %}
            {% if outdoor_temp > 85 %}70{% else %}71{% endif %}
          {% elif 2 <= hour < 6 %}
            {% if outdoor_temp > 80 %}69{% else %}70{% endif %}
          {% else %}
            71
          {% endif %}
          
        # Profile configuration dictionary
        profiles:
          away:
            temperature: 83
            humidity: 60
            fan_percentage: 0
            timeout_minutes: 30
            message: "HVAC: 83°F | Humidity: 60% | Fans: Off | Energy save mode"
            notification_icon: "🏃‍♂️"
            priority: "normal"
            energy_savings: true
          guest:
            temperature: 75
            humidity: 50
            fan_percentage: 30
            timeout_minutes: 25
            message: "HVAC: 75°F | Humidity: 50% | Enhanced circulation for comfort"
            notification_icon: "🏠"
            priority: "normal"
            energy_savings: false
          home:
            temperature: "{{ states('input_number.foundation_cooling_target_home') | float(74) }}"
            humidity: "{{ states('input_number.humidity_target') | float(50) }}"
            fan_percentage: "{{ states('input_number.climate_fan_speed_standard_max') | int(50) }}"
            timeout_minutes: 20
            message: "Home profile restored - Normal operation"
            notification_icon: "🏡"
            priority: "normal"
            energy_savings: false
          sleep:
            temperature: "{{ sleep_temp | float(71) }}"
            humidity: 45
            fan_percentage: 25
            timeout_minutes: 25
            message: "Sleep profile engaged - {{ sleep_temp }}°F"
            notification_icon: "😴"
            priority: "normal"
            energy_savings: false
            
        # Current profile selection
        current_profile: "{{ profiles[preset] }}"
        
        # Equipment status variables
        current_humidity: "{{ states('sensor.average_house_humidity_enhanced_15_sensor') | float(55) }}"
        emergency_humidity: "{{ current_humidity > 60 }}"
        ac_cooling: "{{ is_state('climate.thermostat', 'cooling') }}"
        dehumid_power: "{{ states('sensor.dehumidifier_relay_l1_power') | float(0) }}"
        total_load: "{{ dehumid_power + (3500 if ac_cooling else 0) }}"
        
    # =======================================================================
    # PHASE 3: HVAC TEMPERATURE CONTROL (IMMEDIATE)
    # =======================================================================
    
    - choose:
        # Emergency humidity override - prioritize dehumidification temperature
        - conditions:
            - condition: template
              value_template: "{{ emergency_humidity }}"
          sequence:
            - action: climate.set_temperature
              target:
                entity_id: climate.thermostat
              data:
                temperature: 72  # Aggressive cooling for emergency dehumidification
            - service: notify.mobile_app_drews_iphone
              data:
                title: "🚨 EMERGENCY: {{ preset.title() }} Mode + Humidity Crisis"
                message: "{{ current_humidity | round(1) }}% > 60% ceiling. Emergency cooling + dehumidification active."
                data:
                  priority: "critical"
                  tag: "emergency_humidity"
      default:
        # Normal temperature setting
        - action: climate.set_temperature
          target:
            entity_id: climate.thermostat
          data:
            temperature: "{{ current_profile.temperature }}"
            
    # =======================================================================
    # PHASE 4: PROFESSIONAL HUMIDITY CONTROL
    # =======================================================================
    
    - action: script.professional_humidity_control
      data:
        target_humidity: "{{ current_profile.humidity }}"
        mode_name: "{{ preset.title() }} Mode"
        timeout_minutes: "{{ current_profile.timeout_minutes }}"
      continue_on_error: true
      
    # =======================================================================
    # PHASE 5: FAN COORDINATION AND CIRCULATION
    # =======================================================================
    
    - choose:
        # Away mode - turn off fans for maximum energy savings
        - conditions:
            - condition: template
              value_template: "{{ preset == 'away' }}"
          sequence:
            - action: fan.turn_off
              target:
                entity_id: 
                  - fan.living_room_fan
                  - fan.office_fan
              continue_on_error: true
      default:
        # All other modes - set fan percentage
        - action: fan.set_percentage
          target:
            entity_id:
              - fan.living_room_fan
              - fan.office_fan
          data:
            percentage: "{{ current_profile.fan_percentage }}"
          continue_on_error: true
          
    # =======================================================================
    # PHASE 6: USER NOTIFICATION AND COMPLETION
    # =======================================================================
    
    - service: notify.mobile_app_drews_iphone
      data:
        title: "{{ current_profile.notification_icon }} Smart {{ preset.title() }} Mode Active"
        message: >
          {{ current_profile.message }}
          {% if current_profile.energy_savings %}
          Estimated savings: 25-35%
          {% endif %}
          Current: {{ states('sensor.average_house_temperature_enhanced_15_sensor') }}°F, {{ states('sensor.average_house_humidity_enhanced_15_sensor') }}%
        data:
          tag: "smart_{{ preset }}_mode"
          group: "smart_automation"
          priority: "{{ current_profile.priority }}"
          
    # Final status log
    - service: logbook.log
      data:
        name: "Smart Climate Transition"
        message: "{{ preset.title() }} mode transition completed successfully"
        entity_id: climate.thermostat

# =============================================================================
# LEGACY COMPATIBILITY WRAPPERS (ROLLBACK SUPPORT)
# =============================================================================
# Provides backward compatibility during transition period

# Legacy wrapper scripts for existing automation compatibility
smart_away_mode_transition:
  alias: "Smart Away Mode Transition (Legacy Wrapper)"
  description: "Legacy compatibility wrapper - calls parameterized script"
  sequence:
    - action: script.smart_climate_transition
      data:
        preset: "away"

smart_guest_mode_transition:
  alias: "Smart Guest Mode Transition (Legacy Wrapper)"
  description: "Legacy compatibility wrapper - calls parameterized script"
  sequence:
    - action: script.smart_climate_transition
      data:
        preset: "guest"

smart_home_mode_transition:
  alias: "Smart Home Mode Transition (Legacy Wrapper)"
  description: "Legacy compatibility wrapper - calls parameterized script"
  sequence:
    - action: script.smart_climate_transition
      data:
        preset: "home"

smart_sleep_mode_transition:
  alias: "Smart Sleep Mode Transition (Legacy Wrapper)"
  description: "Legacy compatibility wrapper - calls parameterized script"
  sequence:
    - action: script.smart_climate_transition
      data:
        preset: "sleep"

