# Vacuum Error Notification
- id: vacuum_error_notification
  alias: Vacuum Error Notification
  description: Notify when vacuum encounters an error
  trigger:
    - platform: state
      entity_id: sensor.l10s_ultra_status
      to: error
  action:
    - service: notify.mobile_app_drews_iphone
      data:
        title: "Vacuum Error"
        # Attempt to get a more descriptive error if available
        message: >-
          The vacuum reported an error.
          Status: {{ states('sensor.l10s_ultra_status') }}.
          {% set error_code = state_attr('sensor.l10s_ultra_status', 'error_code') %}
          {% if error_code %}
            Error Code: {{ error_code }}.
          {% endif %}
          {% set error_description = state_attr('sensor.l10s_ultra_status', 'error') %}
          {% if error_description %}
            Description: {{ error_description }}.
          {% endif %}
  # Mode single is usually fine here, but 'queued' or 'parallel' could be
  # considered if errors might rapidly flap.
  mode: single

# Schedule Daily Kitchen Cleanup (Improved Sequence)
- id: daily_kitchen_cleanup
  alias: Daily Kitchen Cleanup
  description: Vacuum and then mop kitchen after dinner, waiting for vacuum completion.
  trigger:
    - platform: time
      at: "21:00:00"
  condition:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
  action:
    # 1. Trigger Kitchen Vacuuming
    - service: automation.trigger
      target:
        entity_id: automation.vacuum_kitchen
      # Relies on vacuum_kitchen's defined parameters
      data: {}

    # 2. Wait for Vacuuming to Finish (Return to Dock/Idle)
    # Waits up to 1.5 hours. If it times out (vacuum stuck/error/offline),
    # stops here.
    - wait_template: >-
        {{ is_state('sensor.l10s_ultra_status', 'charging') or
           is_state('sensor.l10s_ultra_status', 'sleeping') or
           is_state('sensor.l10s_ultra_status', 'idle') }}
      timeout: "01:30:00"
      continue_on_timeout: false

    # 3. Short Delay (Optional - allows dock to potentially prepare for mopping)
    - delay:
        minutes: 2

    # 4. Trigger Kitchen Mopping (only runs if vacuuming finished successfully)
    - service: automation.trigger
      target:
        entity_id: automation.mop_kitchen
      # Relies on mop_kitchen's defined parameters
      data: {}

  # Prevent multiple cleanup sequences running concurrently
  mode: single

# End of Automations