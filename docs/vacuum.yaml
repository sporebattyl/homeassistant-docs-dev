---
# Home Assistant Automations for Dreame L10s Ultra Vacuum
#
# This file contains automations for controlling room cleaning,
# handling errors, and scheduling sequential tasks.
#
# Key Features:
# - Centralized logic (`vacuum_room_automation`) handles parameter setting
#   and execution.
# - Individual automations trigger the central logic for specific rooms/modes.
# - Error notification automation alerts on vacuum issues.
# - Daily kitchen cleanup sequence vacuums, waits, then mops.

# Centralized Vacuum Room Automation
# Trigger the Automation: When you trigger the vacuum_room_automation
# automation (e.g., from another automation or a button press), you can
# now pass in:
#   room_segment: A single number (e.g., 8) or a list of numbers
#     (e.g., [8, 9, 10]).
#   cleaning_mode: sweeping or mopping.
#   suction_level: quiet, turbo, or standard (only used if
#     cleaning_mode is sweeping).
#   mop_pad_humidity: wet, dry, or standard (only used if
#     cleaning_mode is mopping).
#   repeats: Number of times to clean the segment(s), defaults to 1.

- id: vacuum_room_automation
  alias: Vacuum Room (Central Logic)
  description: Vacuums or mops a specified room based on passed parameters.
  trigger: []
  condition: []
  action:
    # Wait until the vacuum is ready (charging, sleeping, or idle) before
    # starting. If it's not ready within 1 hour, the automation run will stop.
    - wait_template: >-
        {{ is_state('sensor.l10s_ultra_status', 'charging') or
           is_state('sensor.l10s_ultra_status', 'sleeping') or
           is_state('sensor.l10s_ultra_status', 'idle') }}
      timeout: "01:00:00"
      continue_on_timeout: false  # Changed from true for safety
    # Set the overall cleaning mode (sweeping or mopping)
    - service: select.select_option
      data:
        option: "{{ cleaning_mode }}"
      target:
        entity_id: select.l10s_ultra_cleaning_mode
    # Set mode-specific parameters (suction for sweeping, humidity for mopping)
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ cleaning_mode == 'sweeping' }}"
          sequence:
            - service: select.select_option
              data:
                # Default added for robustness
                option: "{{ suction_level | default('standard') }}"
              target:
                entity_id: select.l10s_ultra_suction_level
        - conditions:
            - condition: template
              value_template: "{{ cleaning_mode == 'mopping' }}"
          sequence:
            - service: select.select_option
              data:
                # Default added for robustness
                option: "{{ mop_pad_humidity | default('standard') }}"
              target:
                entity_id: select.l10s_ultra_mop_pad_humidity
    # Start the cleaning task for the specified segments
    - service: dreame_vacuum.vacuum_clean_segment
      data:
        segments: "{{ room_segment }}"
        # Use variable 'repeats', default to 1
        repeats: "{{ repeats | default(1) }}"
      target:
        device_id: 72a307905df4391bbe20e7cc4282e2cb
  mode: single

# Vacuum Office
- id: vacuum_office
  alias: Vacuum Office
  description: Vacuums Office (Room 8)
  trigger: []
  condition: []
  action:
    - service: automation.trigger
      target:
        entity_id: automation.vacuum_room_automation
      data:
        room_segment: 8
        cleaning_mode: sweeping
        suction_level: quiet
        # mop_pad_humidity removed (not relevant for sweeping)
  mode: single

# Mop Office
- id: mop_office
