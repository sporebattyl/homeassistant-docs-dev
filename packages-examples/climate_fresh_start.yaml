            {% set humidex_f = (humidex_c * 9/5) + 32 %}
            {% if humidex_f < 80 %}Comfortable
            {% elif humidex_f < 85 %}Noticeable Discomfort
            {% elif humidex_f < 90 %}Uncomfortable
            {% elif humidex_f < 105 %}Very Uncomfortable
            {% else %}Dangerous{% endif %}

      - name: "Feels Like - Kitchen"
        unique_id: feels_like_kitchen
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ states('sensor.climate_kitchen_temperature') not in ['unknown', 'unavailable', 'none'] and
             states('sensor.climate_kitchen_humidity') not in ['unknown', 'unavailable', 'none'] }}
        state: >
