          {% set humidex_c = T_c + 0.5555 * (e - 10) %}
          {% set humidex_f = (humidex_c * 9/5) + 32 %}
          {{ humidex_f | round(1) }}
        attributes:
          room: "Kitchen"
          formula: "Humidex"
          comfort_level: >
            {% set T_f = states('sensor.climate_kitchen_temperature') | float(72) %}
            {% set RH = states('sensor.climate_kitchen_humidity') | float(50) %}
            {% set T_c = (T_f - 32) * 5/9 %}
            {% set e = 6.112 * (10 ** (7.5 * T_c / (237.7 + T_c))) * (RH/100) %}
            {% set humidex_c = T_c + 0.5555 * (e - 10) %}
            {% set humidex_f = (humidex_c * 9/5) + 32 %}
            {% if humidex_f < 80 %}Comfortable
            {% elif humidex_f < 85 %}Noticeable Discomfort
            {% elif humidex_f < 90 %}Uncomfortable
            {% elif humidex_f < 105 %}Very Uncomfortable
            {% else %}Dangerous{% endif %}

      - name: "Feels Like - Office"
        unique_id: feels_like_office
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ states('sensor.climate_office_temperature') not in ['unknown', 'unavailable', 'none'] and
             states('sensor.climate_office_humidity') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set T_f = states('sensor.climate_office_temperature') | float(72) %}
          {% set RH = states('sensor.climate_office_humidity') | float(50) %}
          {% set T_c = (T_f - 32) * 5/9 %}
          {% set e = 6.112 * (10 ** (7.5 * T_c / (237.7 + T_c))) * (RH/100) %}
          {% set humidex_c = T_c + 0.5555 * (e - 10) %}
          {% set humidex_f = (humidex_c * 9/5) + 32 %}
          {{ humidex_f | round(1) }}
        attributes:
          room: "Office"
          formula: "Humidex"
          comfort_level: >
            {% set T_f = states('sensor.climate_office_temperature') | float(72) %}
            {% set RH = states('sensor.climate_office_humidity') | float(50) %}
            {% set T_c = (T_f - 32) * 5/9 %}
            {% set e = 6.112 * (10 ** (7.5 * T_c / (237.7 + T_c))) * (RH/100) %}
            {% set humidex_c = T_c + 0.5555 * (e - 10) %}
            {% set humidex_f = (humidex_c * 9/5) + 32 %}
            {% if humidex_f < 80 %}Comfortable
            {% elif humidex_f < 85 %}Noticeable Discomfort
            {% elif humidex_f < 90 %}Uncomfortable
