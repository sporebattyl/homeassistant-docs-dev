# Fresh Start Climate Automation Package
# Reimagined dew-point-first climate control with manual override surfaces.

input_boolean:
  climate_automation_pause:
    name: Pause Climate Automations
    icon: mdi:pause-octagon
  hvac_emergency_override:
    name: HVAC Emergency Override
    icon: mdi:hvac
  manual_humidity_emergency_override:
    name: Humidity Emergency Override
    icon: mdi:water-alert
  dehumidifier_service_mode:
    name: Dehumidifier Service Mode
    icon: mdi:tools
  dehumidifier_runtime_lockout_active:
    name: Dehumidifier Runtime Lockout
    icon: mdi:timer-alert
    initial: false

input_number:
  climate_occupied_cooling_low:
    name: Occupied Cooling Low Target
    min: 68
    max: 76
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer
    mode: slider
    initial: 72
  climate_occupied_cooling_high:
    name: Occupied Cooling High Target
    min: 72
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-plus
    mode: slider
    initial: 76
  climate_occupied_humidity_max:
    name: "Occupied Humidity Max"
    min: 40
    max: 65
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent
    initial: 55
  climate_unoccupied_cooling_target:
    name: Unoccupied Cooling Target
    min: 74
    max: 82
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermostat
    mode: slider
    initial: 78
  climate_dew_point_limit:
    name: Dew Point Comfort Ceiling
    min: 50
    max: 60
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:water-thermometer
    mode: slider
    initial: 55
  climate_dew_point_emergency:
    name: Dew Point Emergency Threshold
    min: 55
    max: 65
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:alarm-light
    mode: slider
    initial: 57
  climate_dew_point_lockout:
    name: Dew Point Lockout Ceiling
    min: 57
    max: 68
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:shield-alert
    mode: slider
    initial: 60
  climate_dehumidifier_runtime_cap:
    name: Dehumidifier Max Runtime (min)
    min: 15
    max: 180
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-cog
    mode: slider
    initial: 90
  climate_hvac_runtime_cap:
    name: HVAC Max Runtime (min)
    min: 15
    max: 120
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-cog
    mode: slider
    initial: 45
  climate_hvac_rest_window:
    name: HVAC Rest Window (min)
    min: 5
    max: 30
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-off
    mode: slider
    initial: 10
  climate_dehumidifier_rest_window:
    name: Dehumidifier Rest Window (min)
    min: 5
    max: 30
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-off
    mode: slider
    initial: 10
  foundation_cooling_target_home:
    name: "Foundation Cooling Target (Home)"
    min: 70
    max: 80
    step: 0.5
    initial: 74
    unit_of_measurement: "°F"
    icon: mdi:thermometer
    mode: slider
  foundation_cooling_target_sleep:
    name: "Foundation Cooling Target (Sleep)"
    min: 68
    max: 76
    step: 0.5
    initial: 73
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-down
    mode: slider
  foundation_humidity_max_home:
    name: "Foundation Humidity Maximum (Home)"
    min: 45
    max: 60
    step: 1
    initial: 55
    unit_of_measurement: "%"
    icon: mdi:water-percent
    mode: slider

input_datetime:
  hvac_last_cool_start:
    name: HVAC Last Cool Start
    has_date: true
    has_time: true
  hvac_last_cool_stop:
    name: HVAC Last Cool Stop
    has_date: true
    has_time: true
  dehumidifier_last_start:
    name: Dehumidifier Last Start
    has_date: true
    has_time: true
  dehumidifier_last_stop:
    name: Dehumidifier Last Stop
    has_date: true
    has_time: true
  emergency_humidity_override_timestamp:
    name: Emergency Humidity Override Timestamp
    has_date: true
    has_time: true
  reset_all_overrides_timestamp:
    name: Reset All Overrides Timestamp
    has_date: true
    has_time: true

input_text:
  thermostat_previous_fan_mode:
    name: Thermostat Previous Fan Mode
    icon: mdi:fan

template:
  - binary_sensor:
      - name: Climate Any Room Occupied
        unique_id: climate_any_room_occupied
        state: >-
          {% set sensors = [
            'binary_sensor.presence_living_room_presence',
            'binary_sensor.presence_master_bedroom_presence',
            'binary_sensor.presence_rowans_room_presence',
            'binary_sensor.presence_kitchen_presence',
            'binary_sensor.presence_office_presence',
            'binary_sensor.presence_guest_bedroom_presence',
            'binary_sensor.thermostat_motion',
            'binary_sensor.thermostat_occupancy'
          ] %}
          {% set ns = namespace(active=false) %}
          {% for sensor_id in sensors %}
            {% if states(sensor_id) in ['on', 'home'] %}
              {% set ns.active = true %}
            {% endif %}
          {% endfor %}
          {{ ns.active }}

      - name: Humidity Emergency Condition
        unique_id: humidity_emergency_condition
        device_class: problem
        state: >-
          {% set dew_point = states('sensor.max_indoor_dew_point_enhanced') | float(0) %}
          {% set emergency = states('input_number.climate_dew_point_emergency') | float(57) %}
          {{ dew_point >= emergency }}

      - name: Humidity Lockout Condition
        unique_id: humidity_lockout_condition
        device_class: problem
        state: >-
          {% set dew_point = states('sensor.max_indoor_dew_point_enhanced') | float(0) %}
          {% set ceiling = states('input_number.climate_dew_point_lockout') | float(60) %}
          {{ dew_point >= ceiling }}

      - name: HVAC Rest Window Active
        unique_id: hvac_rest_window_active
        state: >-
          {% set last_stop = states('input_datetime.hvac_last_cool_stop') %}
          {% set rest_minutes = states('input_number.climate_hvac_rest_window') | float(10) %}
          {% if last_stop in ['unknown', 'unavailable', ''] %}
            false
          {% else %}
            {% set elapsed = (as_timestamp(now()) - as_timestamp(last_stop)) / 60 %}
            {{ elapsed < rest_minutes }}
          {% endif %}

      - name: Dehumidifier Rest Window Active
        unique_id: dehumidifier_rest_window_active
        state: >-
          {% set last_stop = states('input_datetime.dehumidifier_last_stop') %}
          {% set rest_minutes = states('input_number.climate_dehumidifier_rest_window') | float(10) %}
          {% if last_stop in ['unknown', 'unavailable', ''] %}
            false
          {% else %}
            {% set elapsed = (as_timestamp(now()) - as_timestamp(last_stop)) / 60 %}
            {{ elapsed < rest_minutes }}
          {% endif %}

      - name: Dehumidifier Power Mismatch
        unique_id: dehumidifier_power_mismatch
        device_class: problem
        state: >-
          {% set relay_on = is_state('switch.dehumidifier_relay_l1', 'on') %}
          {% set outlet_on = is_state('switch.dehumidifier_outlet_switch', 'on') %}
          {% set outlet_power = states('sensor.dehumidifier_outlet_switch_power') | float(0) %}
          {% if relay_on and outlet_on %}
            {{ outlet_power < 50 }}
          {% elif relay_on and not outlet_on %}
            true
          {% else %}
            false
          {% endif %}

      - name: HVAC Minimum Run Satisfied
        unique_id: hvac_minimum_run_satisfied
        state: >-
          {% set last_start = states('input_datetime.hvac_last_cool_start') %}
          {% if state_attr('climate.thermostat', 'hvac_action') == 'cooling' and
                last_start not in ['unknown', 'unavailable', ''] %}
            {% set elapsed = (as_timestamp(now()) - as_timestamp(last_start)) / 60 %}
            {{ elapsed >= 15 }}
          {% else %}
            true
          {% endif %}

      - name: HVAC Runtime Exceeded
        unique_id: hvac_runtime_exceeded
        state: >-
          {% set last_start = states('input_datetime.hvac_last_cool_start') %}
          {% if state_attr('climate.thermostat', 'hvac_action') == 'cooling' and
                last_start not in ['unknown', 'unavailable', ''] %}
            {% set elapsed = (as_timestamp(now()) - as_timestamp(last_start)) / 60 %}
            {% set cap = states('input_number.climate_hvac_runtime_cap') | float(45) %}
            {{ elapsed >= cap }}
          {% else %}
            false
          {% endif %}

      - name: Dehumidifier Minimum Run Satisfied
        unique_id: dehumidifier_minimum_run_satisfied
        state: >-
          {% if is_state('switch.dehumidifier_relay_l1', 'on') %}
            {% set last_start = states('input_datetime.dehumidifier_last_start') %}
            {% if last_start in ['unknown', 'unavailable', ''] %}
              false
            {% else %}
              {% set elapsed = (as_timestamp(now()) - as_timestamp(last_start)) / 60 %}
              {{ elapsed >= 15 }}
            {% endif %}
          {% else %}
            true
          {% endif %}

      - name: Thermostat Cooling Active
        unique_id: thermostat_cooling_action
        device_class: running
        icon: mdi:snowflake
        state: >-
          {{ state_attr('climate.thermostat', 'hvac_action') == 'cooling' }}

      - name: Thermostat Heating Active
        unique_id: thermostat_heating_action
        device_class: running
        icon: mdi:fire
        state: >-
          {{ state_attr('climate.thermostat', 'hvac_action') == 'heating' }}

      - name: Thermostat Idle
        unique_id: thermostat_idle_action
        device_class: running
        icon: mdi:hvac-off
        state: >-
          {{ state_attr('climate.thermostat', 'hvac_action') == 'idle' }}

  - sensor:
      - name: average_house_dew_point_enhanced
        unit_of_measurement: "°F"
        state: >-
          {% from 'dew_point.jinja' import dew_point_f %}
          {% set invalid = ['unknown', 'unavailable', 'none', None, '', 'nan'] %}
          {% set sensor_list = [
            'sensor.climate_living_room', 'sensor.climate_dining_room', 'sensor.climate_kitchen',
            'sensor.climate_office', 'sensor.climate_rowans_room', 'sensor.climate_guest_bedroom',
            'sensor.climate_guest_bathroom', 'sensor.climate_half_bathroom', 'sensor.climate_foyer_front_door',
            'sensor.climate_foyer_garage', 'sensor.climate_master_bedroom', 'sensor.climate_master_bathroom',
            'sensor.climate_master_closet', 'sensor.climate_laundry_room', 'sensor.thermostat_current'
          ] %}
          {% set totals = namespace(sum=0.0, count=0) %}
          {% for sensor_base in sensor_list %}
            {% set temp_val = states(sensor_base ~ '_temperature') %}
            {% set humidity_val = states(sensor_base ~ '_humidity') %}
            {% if temp_val not in invalid and humidity_val not in invalid %}
              {% set candidate = dew_point_f(temp_val, humidity_val) %}
              {% if candidate is not none %}
                {% set totals.sum = totals.sum + (candidate | float) %}
                {% set totals.count = totals.count + 1 %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if totals.count > 0 %}
            {{ (totals.sum / totals.count) | round(2) }}
          {% else %}
            {% set fallback =
              dew_point_f(states('sensor.thermostat_current_temperature'),
                          states('sensor.thermostat_current_humidity')) %}
            {{ fallback | round(2) if fallback is not none else 'unknown' }}
          {% endif %}
      - name: max_indoor_dew_point_enhanced
        unit_of_measurement: "°F"
        state: >-
          {% from 'dew_point.jinja' import dew_point_f %}
          {% set invalid = ['unknown', 'unavailable', 'none', None, '', 'nan'] %}
          {% set sensor_list = [
            'sensor.climate_living_room', 'sensor.climate_dining_room', 'sensor.climate_kitchen',
            'sensor.climate_office', 'sensor.climate_rowans_room', 'sensor.climate_guest_bedroom',
            'sensor.climate_guest_bathroom', 'sensor.climate_half_bathroom', 'sensor.climate_foyer_front_door',
            'sensor.climate_foyer_garage', 'sensor.climate_master_bedroom', 'sensor.climate_master_bathroom',
            'sensor.climate_master_closet', 'sensor.climate_laundry_room', 'sensor.thermostat_current'
          ] %}
          {% set max_dew = none %}
          {% for sensor_base in sensor_list %}
            {% set temp_val = states(sensor_base ~ '_temperature') %}
            {% set humidity_val = states(sensor_base ~ '_humidity') %}
            {% if temp_val not in invalid and humidity_val not in invalid %}
              {% set candidate = dew_point_f(temp_val, humidity_val) %}
              {% if candidate is not none %}
                {% if max_dew is none or candidate > max_dew %}
                  {% set max_dew = candidate %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if max_dew is not none %}
            {{ max_dew | round(2) }}
          {% else %}
            {% set fallback =
              dew_point_f(states('sensor.thermostat_current_temperature'),
                          states('sensor.thermostat_current_humidity')) %}
            {% if fallback is not none %}
              {{ fallback | round(2) }}
            {% else %}
              unknown
            {% endif %}
          {% endif %}
      - name: priority_dew_point_enhanced
        unit_of_measurement: "°F"
        state: >-
          {% from 'dew_point.jinja' import dew_point_f %}
          {% set invalid = ['unknown', 'unavailable', 'none', None, '', 'nan'] %}
          {% set priority_zones = [
            {'sensor': 'sensor.climate_living_room',
             'presence': 'binary_sensor.presence_living_room_presence',
             'label': 'Living Room'},
            {'sensor': 'sensor.climate_dining_room',
             'presence': 'binary_sensor.presence_dining_room_presence',
             'label': 'Dining Room'},
            {'sensor': 'sensor.climate_kitchen',
             'presence': 'binary_sensor.presence_kitchen_presence',
             'label': 'Kitchen'},
            {'sensor': 'sensor.climate_office',
             'presence': 'binary_sensor.presence_office_presence',
             'label': 'Office'},
            {'sensor': 'sensor.climate_master_bedroom',
             'presence': 'binary_sensor.presence_master_bedroom_presence',
             'label': 'Master Bedroom'},
            {'sensor': 'sensor.climate_rowans_room',
             'presence': 'binary_sensor.presence_rowans_room_presence',
             'label': "Rowan's Room"}
          ] %}
          {% set occupied = [] %}
          {% set fallback = [] %}
          {% for zone in priority_zones %}
            {% set temp_val = states(zone.sensor ~ '_temperature') %}
            {% set humidity_val = states(zone.sensor ~ '_humidity') %}
            {% if temp_val not in invalid and humidity_val not in invalid %}
              {% set dew = dew_point_f(temp_val, humidity_val) %}
              {% if dew is not none %}
                {% set fallback = fallback + [dew] %}
                {% if states(zone.presence) in ['on', 'home'] %}
                  {% set occupied = occupied + [dew] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if occupied %}
            {{ (occupied | max) | round(2) }}
          {% elif fallback %}
            {{ (fallback | max) | round(2) }}
          {% else %}
            {% set alt = states('sensor.max_indoor_dew_point_enhanced') %}
            {% if alt in invalid %}
              unknown
            {% else %}
              {{ alt | float | round(2) }}
            {% endif %}
          {% endif %}
        attributes:
          occupied_rooms: >-
            {% from 'dew_point.jinja' import dew_point_f %}
            {% set invalid = ['unknown', 'unavailable', 'none', None, '', 'nan'] %}
            {% set priority_zones = [
              {'sensor': 'sensor.climate_living_room',
               'presence': 'binary_sensor.presence_living_room_presence',
               'label': 'Living Room'},
              {'sensor': 'sensor.climate_dining_room',
               'presence': 'binary_sensor.presence_dining_room_presence',
               'label': 'Dining Room'},
              {'sensor': 'sensor.climate_kitchen',
               'presence': 'binary_sensor.presence_kitchen_presence',
               'label': 'Kitchen'},
              {'sensor': 'sensor.climate_office',
               'presence': 'binary_sensor.presence_office_presence',
               'label': 'Office'},
              {'sensor': 'sensor.climate_master_bedroom',
               'presence': 'binary_sensor.presence_master_bedroom_presence',
               'label': 'Master Bedroom'},
              {'sensor': 'sensor.climate_rowans_room',
               'presence': 'binary_sensor.presence_rowans_room_presence',
               'label': "Rowan's Room"}
            ] %}
            {% set names = [] %}
            {% for zone in priority_zones %}
              {% set temp_val = states(zone.sensor ~ '_temperature') %}
              {% set humidity_val = states(zone.sensor ~ '_humidity') %}
              {% if temp_val not in invalid and humidity_val not in invalid %}
                {% set dew = dew_point_f(temp_val, humidity_val) %}
                {% if dew is not none and states(zone.presence) in ['on', 'home'] %}
                  {% set names = names + [zone.label] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ names | join(', ') if names else 'None' }}

      # Feels Like Temperature Sensors (Heat Index)
      # Indoor sensors use Humidex formula (optimized for 68-78°F indoor range)
      # Outdoor sensor uses NWS Heat Index formula (80°F+ threshold)

      - name: "Feels Like - Living Room"
        unique_id: feels_like_living_room
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ states('sensor.climate_living_room_temperature') not in ['unknown', 'unavailable', 'none'] and
             states('sensor.climate_living_room_humidity') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set T_f = states('sensor.climate_living_room_temperature') | float(72) %}
          {% set RH = states('sensor.climate_living_room_humidity') | float(50) %}
          {% set T_c = (T_f - 32) * 5/9 %}
          {% set e = 6.112 * (10 ** (7.5 * T_c / (237.7 + T_c))) * (RH/100) %}
          {% set humidex_c = T_c + 0.5555 * (e - 10) %}
          {% set humidex_f = (humidex_c * 9/5) + 32 %}
          {{ humidex_f | round(1) }}
        attributes:
          room: "Living Room"
          formula: "Humidex"
          comfort_level: >
            {% set T_f = states('sensor.climate_living_room_temperature') | float(72) %}
            {% set RH = states('sensor.climate_living_room_humidity') | float(50) %}
            {% set T_c = (T_f - 32) * 5/9 %}
            {% set e = 6.112 * (10 ** (7.5 * T_c / (237.7 + T_c))) * (RH/100) %}
            {% set humidex_c = T_c + 0.5555 * (e - 10) %}
            {% set humidex_f = (humidex_c * 9/5) + 32 %}
            {% if humidex_f < 80 %}Comfortable
            {% elif humidex_f < 85 %}Noticeable Discomfort
            {% elif humidex_f < 90 %}Uncomfortable
            {% elif humidex_f < 105 %}Very Uncomfortable
            {% else %}Dangerous{% endif %}

      - name: "Feels Like - Dining Room"
        unique_id: feels_like_dining_room
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ states('sensor.climate_dining_room_temperature') not in ['unknown', 'unavailable', 'none'] and
