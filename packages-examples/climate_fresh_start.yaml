      # House Average Feels Like (average of 14 indoor Humidex sensors)
      - name: "Feels Like - House Average"
        unique_id: feels_like_house_average
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ states('sensor.feels_like_living_room') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set sensors = [
            'sensor.feels_like_living_room',
            'sensor.feels_like_dining_room',
            'sensor.feels_like_kitchen',
            'sensor.feels_like_office',
            'sensor.feels_like_master_bedroom',
            'sensor.feels_like_rowans_room',
            'sensor.feels_like_guest_bedroom',
            'sensor.feels_like_master_bathroom',
            'sensor.feels_like_guest_bathroom',
            'sensor.feels_like_half_bathroom',
            'sensor.feels_like_master_closet',
            'sensor.feels_like_laundry_room',
            'sensor.feels_like_foyer_front_door',
            'sensor.feels_like_foyer_garage'
          ] %}
          {% set valid_sensors = sensors | select('has_value') | list %}
          {% if valid_sensors | length > 0 %}
            {{ (valid_sensors | map('states') | map('float') | sum / (valid_sensors | length)) | round(1) }}
          {% else %}
            {{ states('sensor.climate_living_room_temperature') | float(72) }}
          {% endif %}
        attributes:
          rooms_counted: >
            {% set sensors = [
              'sensor.feels_like_living_room',
              'sensor.feels_like_dining_room',
              'sensor.feels_like_kitchen',
              'sensor.feels_like_office',
              'sensor.feels_like_master_bedroom',
              'sensor.feels_like_rowans_room',
              'sensor.feels_like_guest_bedroom',
              'sensor.feels_like_master_bathroom',
              'sensor.feels_like_guest_bathroom',
              'sensor.feels_like_half_bathroom',
              'sensor.feels_like_master_closet',
              'sensor.feels_like_laundry_room',
              'sensor.feels_like_foyer_front_door',
              'sensor.feels_like_foyer_garage'
            ] %}
            {{ sensors | select('has_value') | list | length }}
          formula: "Average of 14 indoor Humidex sensors"
          comfort_level: >
            {% set sensors = [
              'sensor.feels_like_living_room',
              'sensor.feels_like_dining_room',
              'sensor.feels_like_kitchen',
              'sensor.feels_like_office',
              'sensor.feels_like_master_bedroom',
              'sensor.feels_like_rowans_room',
              'sensor.feels_like_guest_bedroom',
              'sensor.feels_like_master_bathroom',
              'sensor.feels_like_guest_bathroom',
              'sensor.feels_like_half_bathroom',
              'sensor.feels_like_master_closet',
              'sensor.feels_like_laundry_room',
              'sensor.feels_like_foyer_front_door',
              'sensor.feels_like_foyer_garage'
            ] %}
            {% set valid_sensors = sensors | select('has_value') | list %}
            {% if valid_sensors | length > 0 %}
              {% set avg = (valid_sensors | map('states') | map('float') | sum / (valid_sensors | length)) %}
              {% if avg < 80 %}Comfortable
              {% elif avg < 85 %}Noticeable Discomfort
              {% elif avg < 90 %}Uncomfortable
              {% elif avg < 105 %}Very Uncomfortable
              {% else %}Dangerous{% endif %}
            {% else %}Comfortable{% endif %}

      # Outdoor Feels Like (NWS Heat Index formula, 80°F+ threshold)
      - name: "Feels Like - Outdoor"
        unique_id: feels_like_outdoor
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {{ states('sensor.climate_outdoor_back_porch_temperature') not in ['unknown', 'unavailable', 'none'] and
             states('sensor.climate_outdoor_back_porch_humidity') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set T = states('sensor.climate_outdoor_back_porch_temperature') | float(80) %}
          {% set RH = states('sensor.climate_outdoor_back_porch_humidity') | float(50) %}
          {% if T < 80 %}
            {{ T | round(1) }}
          {% else %}
            {% set HI = -42.379 + 2.04901523*T + 10.14333127*RH - 0.22475541*T*RH -
                        0.00683783*T*T - 0.05481717*RH*RH + 0.00122874*T*T*RH +
                        0.00085282*T*RH*RH - 0.00000199*T*T*RH*RH %}
            {{ [T, HI] | max | round(1) }}
          {% endif %}
        attributes:
          location: "Outdoor (Back Porch)"
          formula: "NWS Heat Index"
          outdoor_temp: >
            {{ states('sensor.climate_outdoor_back_porch_temperature') | float(0) }}
          outdoor_humidity: >
            {{ states('sensor.climate_outdoor_back_porch_humidity') | float(0) }}
          comfort_level: >
            {% set T = states('sensor.climate_outdoor_back_porch_temperature') | float(80) %}
            {% set RH = states('sensor.climate_outdoor_back_porch_humidity') | float(50) %}
            {% if T < 80 %}
              {% set HI = T %}
            {% else %}
              {% set HI = -42.379 + 2.04901523*T + 10.14333127*RH - 0.22475541*T*RH -
                          0.00683783*T*T - 0.05481717*RH*RH + 0.00122874*T*T*RH +
                          0.00085282*T*RH*RH - 0.00000199*T*T*RH*RH %}
              {% set HI = [T, HI] | max %}
            {% endif %}
            {% if HI < 80 %}Comfortable
            {% elif HI < 90 %}Caution
            {% elif HI < 103 %}Extreme Caution
            {% elif HI < 125 %}Danger
            {% else %}Extreme Danger{% endif %}

      - name: Environmental Intelligence Control
        unique_id: environmental_intelligence_status_control
        state: >-
          {% set dew = states('sensor.max_indoor_dew_point_enhanced') | float(0) %}
          {% set avg_temp = states('sensor.average_house_temperature_combined') | float(0) %}
          {% set limit = states('input_number.climate_dew_point_limit') | float(55) %}
          {% set emergency = states('input_number.climate_dew_point_emergency') | float(57) %}
          {% set lockout = states('input_number.climate_dew_point_lockout') | float(60) %}
          {% if dew >= lockout %}
            emergency
          {% elif dew >= emergency %}
            severe
          {% elif dew >= limit %}
            caution
          {% elif avg_temp > ((states('input_number.climate_occupied_cooling_high') | float(76)) + 1) %}
            alert
          {% else %}
            stable
          {% endif %}
        attributes:
          dew_point: "{{ states('sensor.max_indoor_dew_point_enhanced') }}"
          avg_temperature: "{{ states('sensor.average_house_temperature_combined') }}"
          avg_humidity: "{{ states('sensor.average_house_humidity_combined') }}"
          rest_block_active: >-
            {{ is_state('binary_sensor.hvac_rest_window_active', 'on') or
               is_state('binary_sensor.dehumidifier_rest_window_active', 'on') }}
          automation_paused: "{{ is_state('input_boolean.climate_automation_pause', 'on') }}"
      - name: emergency_humidity_override_timestamp
        state: >-
          {% set stamp = states('input_datetime.emergency_humidity_override_timestamp') %}
          {% if stamp in ['unknown', 'unavailable', ''] %}
            unknown
          {% else %}
            {% set dt = as_datetime(stamp) %}
            {% if dt %}
              {{ as_local(dt).strftime('%Y-%m-%d %H:%M:%S') }}
            {% else %}
              unknown
            {% endif %}
          {% endif %}
      - name: reset_all_overrides_timestamp
        state: >-
          {% set stamp = states('input_datetime.reset_all_overrides_timestamp') %}
          {% if stamp in ['unknown', 'unavailable', ''] %}
            unknown
          {% else %}
            {% set dt = as_datetime(stamp) %}
            {% if dt %}
              {{ as_local(dt).strftime('%Y-%m-%d %H:%M:%S') }}
            {% else %}
              unknown
            {% endif %}
          {% endif %}
      - name: "Equipment Arbitration Emergency Count"
        unique_id: equipment_arbitration_emergency_count
        state: "{{ states('counter.equipment_arbitration_emergencies') | int(0) }}"
        unit_of_measurement: "events"
        icon: mdi:counter

  - binary_sensor:
      - name: climate_automation_active
        state: >-
          {{ is_state('input_boolean.climate_automation_pause', 'off') }}
      - name: "Equipment Arbitration Emergency Active"
        unique_id: equipment_arbitration_emergency_active
        device_class: problem
        state: >
          {{ is_state('binary_sensor.humidity_emergency_condition', 'on')
             or is_state('input_boolean.hvac_emergency_override', 'on') }}
        availability: >
          {{ has_value('binary_sensor.humidity_emergency_condition')
             and has_value('input_boolean.hvac_emergency_override') }}

script:
  emergency_humidity_override:
    alias: Emergency Dehumidification Override
    description: Manual emergency humidity override with safety protocols
    sequence:
      - service: logbook.log
        data:
          name: Emergency Action
          message: Manual humidity emergency override activated - Immediate dehumidification
          entity_id: sensor.humidity_emergency_system_status
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.manual_humidity_emergency_override
      - service: climate.set_humidity
        target:
          entity_id: climate.thermostat
        data:
          humidity: 50
      - wait_template: >-
          {% set target = 50 %}
          {% set current = state_attr('climate.thermostat', 'target_humidity') %}
          {% set fallback = state_attr('climate.thermostat', 'humidity') %}
          {{ current == target or fallback == target }}
        timeout: "00:00:30"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence: []
        default:
          - service: logbook.log
            data:
              name: Humidity Override Warning
              message: Thermostat humidity target did not confirm within 30 seconds
              entity_id: climate.thermostat
          - service: notify.notify
            data:
              title: "Emergency Dehumidification Verification"
              message: >-
                Thermostat humidity target failed to confirm 50% within 30 seconds.
                Review climate.thermostat state.
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.dehumidifier_relay_l1
                state: 'off'
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.dehumidifier_relay_l1
        default: []
      - service: notify.mobile_app_drews_iphone
        data:
          title: "🚨 Emergency Dehumidification Active"
          message: >-
            Manual humidity override activated - Target: 50% |
            Current: {{ states('sensor.average_house_humidity_combined') }}%
          data:
            priority: high
            sound: alarm.wav
      - service: timer.start
        target:
          entity_id: timer.emergency_lockout_timer

  emergency_cooling_boost:
    alias: Emergency Cooling Boost
    description: Emergency cooling boost with equipment protection
    sequence:
      - service: logbook.log
        data:
          name: Emergency Action
          message: Emergency cooling boost activated - Immediate cooling response
          entity_id: sensor.climate_safety_master_status
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_emergency_override
      - service: climate.turn_on
        target:
          entity_id: climate.thermostat
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.thermostat
        data:
          hvac_mode: cool
      - wait_template: >-
          {{ state_attr('climate.thermostat', 'hvac_mode') == 'cool' or states('climate.thermostat') == 'cool' }}
        timeout: "00:00:30"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence: []
        default:
          - service: logbook.log
            data:
              name: Emergency Cooling Boost Warning
              message: Thermostat did not confirm cool mode within 30 seconds
              entity_id: climate.thermostat
          - service: notify.notify
            data:
              title: "Emergency Cooling Boost Verification"
              message: "Thermostat failed to confirm cool mode within 30 seconds. Review climate.thermostat state."
      - delay: "00:00:03"
      - service: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          temperature: 70
      - wait_template: >-
          {% set target = 70 %}
          {% set temperature = state_attr('climate.thermostat', 'temperature') %}
          {% set high = state_attr('climate.thermostat', 'target_temp_high') %}
          {% set low = state_attr('climate.thermostat', 'target_temp_low') %}
          {{ temperature == target or high == target or low == target }}
        timeout: "00:00:30"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence: []
        default:
          - service: logbook.log
            data:
              name: Emergency Cooling Boost Warning
              message: Thermostat cooling target did not confirm 70°F within 30 seconds
              entity_id: climate.thermostat
          - service: notify.notify
            data:
              title: "Emergency Cooling Boost Verification"
              message: >-
                Thermostat target temperature failed to confirm 70°F within 30 seconds.
                Review thermostat status.
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ has_attr('climate.thermostat', 'fan_mode') }}"
            sequence:
              - service: climate.set_fan_mode
                target:
                  entity_id: climate.thermostat
                data:
                  fan_mode: high
        default: []
      - service: notify.mobile_app_drews_iphone
        data:
          title: "❄️ Emergency Cooling Active"
          message: >-
            Emergency cooling boost engaged - Target: 70°F |
            Current: {{ states('sensor.average_house_temperature_combined') }}°F
          data:
            priority: high
            sound: alarm.wav
      - service: timer.start
        target:
          entity_id: timer.hvac_runtime_monitor

  climate_system_restart:
    alias: Restart Climate System
    description: Restart climate system with graceful equipment shutdown and recovery
    sequence:
      - service: logbook.log
        data:
          name: System Action
          message: Climate system restart initiated - Graceful equipment recovery
          entity_id: sensor.climate_safety_master_status
      - service: climate.turn_off
        target:
          entity_id: climate.thermostat
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.dehumidifier_relay_l1
                state: 'on'
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.dehumidifier_relay_l1
        default: []
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hvac_emergency_override
            - input_boolean.manual_humidity_emergency_override
      - service: timer.cancel
        target:
          entity_id:
            - timer.hvac_runtime_monitor
            - timer.hvac_cooldown_timer
            - timer.dehumidifier_runtime_monitor
            - timer.dehumidifier_cooldown_timer
            - timer.emergency_lockout_timer
      - delay:
          seconds: 15
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.thermostat
        data:
          hvac_mode: heat_cool
      - wait_template: >-
          {{ state_attr('climate.thermostat', 'hvac_mode') == 'heat_cool' or states('climate.thermostat') == 'heat_cool' }}
        timeout: "00:00:30"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence: []
        default:
          - service: logbook.log
            data:
              name: Climate Restart Warning
              message: Thermostat did not confirm auto mode within 30 seconds
              entity_id: climate.thermostat
          - service: notify.notify
            data:
              title: "Climate System Restart Verification"
              message: "Thermostat failed to confirm auto mode within 30 seconds during restart."
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not is_state('climate.thermostat', 'auto') }}"
            sequence:
              - service: climate.set_hvac_mode
                target:
                  entity_id: climate.thermostat
                data:
                  hvac_mode: 'auto'
              - service: logbook.log
                data:
                  name: "Climate System Restart"
                  message: "Fallback: Manually restored thermostat to auto mode after wait_template timeout"
                  entity_id: climate.thermostat
      - delay: "00:00:03"
      - service: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          target_temp_high: "{{ states('input_number.climate_occupied_cooling_high') | float(76) }}"
          target_temp_low: "{{ states('input_number.climate_occupied_cooling_low') | float(72) }}"
      - wait_template: >-
          {% set high_target = states('input_number.climate_occupied_cooling_high') | float(76) %}
          {% set low_target = states('input_number.climate_occupied_cooling_low') | float(72) %}
          {% set high_state = state_attr('climate.thermostat', 'target_temp_high') %}
          {% set low_state = state_attr('climate.thermostat', 'target_temp_low') %}
          {{ (high_state | float(high_target)) | round(1) == (high_target | round(1)) and
             (low_state | float(low_target)) | round(1) == (low_target | round(1)) }}
        timeout: "00:00:45"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence: []
        default:
          - service: logbook.log
            data:
              name: Climate Restart Warning
              message: Thermostat setpoints did not confirm occupied band within 45 seconds
              entity_id: climate.thermostat
          - service: notify.notify
            data:
              title: "Climate System Restart Verification"
              message: "Thermostat failed to confirm occupied cooling setpoints within 45 seconds during restart."
      - service: climate.set_humidity
        target:
          entity_id: climate.thermostat
        data:
          humidity: "{{ states('input_number.climate_occupied_humidity_max') | float(55) }}"
      - wait_template: >-
          {% set target = states('input_number.climate_occupied_humidity_max') | float(55) %}
          {% set current = state_attr('climate.thermostat', 'target_humidity') %}
          {% set fallback = state_attr('climate.thermostat', 'humidity') %}
          {{ (current | float(target)) | round(0) == (target | round(0)) or
             (fallback | float(target)) | round(0) == (target | round(0)) }}
        timeout: "00:00:30"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence: []
        default:
          - service: logbook.log
            data:
              name: Climate Restart Warning
              message: Thermostat humidity target did not confirm within 30 seconds
              entity_id: climate.thermostat
          - service: notify.notify
            data:
              title: "Climate System Restart Verification"
              message: "Thermostat failed to confirm humidity target within 30 seconds during restart."
      - service: notify.mobile_app_drews_iphone
        data:
          title: "🔄 Climate System Restarted"
          message: Climate system restart complete - Normal operation resumed
          data:
            priority: normal

  reset_all_overrides:
    alias: Reset All Emergency Overrides
    description: Reset all emergency overrides and restore normal climate operation
    sequence:
      - service: logbook.log
        data:
          name: System Reset
          message: All emergency overrides reset - Normal climate operation restored
          entity_id: sensor.climate_safety_master_status
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.hvac_emergency_override
            - input_boolean.manual_humidity_emergency_override
      - service: timer.cancel
        target:
          entity_id:
            - timer.hvac_runtime_monitor
            - timer.hvac_cooldown_timer
            - timer.dehumidifier_runtime_monitor
            - timer.dehumidifier_cooldown_timer
            - timer.emergency_lockout_timer
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.thermostat
        data:
          hvac_mode: heat_cool
      - wait_template: >-
          {{ state_attr('climate.thermostat', 'hvac_mode') == 'heat_cool' or states('climate.thermostat') == 'heat_cool' }}
        timeout: "00:00:30"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence: []
        default:
          - service: logbook.log
            data:
              name: Override Reset Warning
              message: Thermostat did not confirm auto mode within 30 seconds
              entity_id: climate.thermostat
          - service: notify.notify
            data:
              title: "Reset Overrides Verification"
              message: "Thermostat failed to confirm auto mode within 30 seconds while resetting overrides."
      - delay: "00:00:03"
      - service: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          target_temp_high: "{{ states('input_number.climate_occupied_cooling_high') | float(76) }}"
          target_temp_low: "{{ states('input_number.climate_occupied_cooling_low') | float(72) }}"
      - wait_template: >-
          {% set high_target = states('input_number.climate_occupied_cooling_high') | float(76) %}
          {% set low_target = states('input_number.climate_occupied_cooling_low') | float(72) %}
          {% set high_state = state_attr('climate.thermostat', 'target_temp_high') %}
          {% set low_state = state_attr('climate.thermostat', 'target_temp_low') %}
          {{ (high_state | float(high_target)) | round(1) == (high_target | round(1)) and
             (low_state | float(low_target)) | round(1) == (low_target | round(1)) }}
        timeout: "00:00:45"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence: []
        default:
          - service: logbook.log
            data:
              name: Override Reset Warning
              message: Thermostat setpoints did not confirm occupied band within 45 seconds
              entity_id: climate.thermostat
          - service: notify.notify
            data:
              title: "Reset Overrides Verification"
              message: >-
                Thermostat failed to confirm occupied cooling setpoints within 45 seconds
                while resetting overrides.
      - service: climate.set_humidity
        target:
          entity_id: climate.thermostat
        data:
          humidity: "{{ states('input_number.climate_occupied_humidity_max') | float(55) }}"
      - wait_template: >-
          {% set target = states('input_number.climate_occupied_humidity_max') | float(55) %}
          {% set current = state_attr('climate.thermostat', 'target_humidity') %}
          {% set fallback = state_attr('climate.thermostat', 'humidity') %}
          {{ (current | float(target)) | round(0) == (target | round(0)) or
             (fallback | float(target)) | round(0) == (target | round(0)) }}
        timeout: "00:00:30"
        continue_on_timeout: true
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed }}"
            sequence: []
        default:
          - service: logbook.log
            data:
              name: Override Reset Warning
              message: Thermostat humidity target did not confirm within 30 seconds
              entity_id: climate.thermostat
          - service: notify.notify
            data:
              title: "Reset Overrides Verification"
              message: "Thermostat failed to confirm humidity target within 30 seconds while resetting overrides."
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('switch.dehumidifier_relay_l1') != 'unavailable' }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.dehumidifier_relay_l1
        default: []
      - service: notify.mobile_app_drews_iphone
        data:
          title: "✅ All Overrides Reset"
          message: >-
            Emergency overrides cleared - Normal climate operation restored |
            Temp: {{ states('input_number.climate_occupied_cooling_high') }}°F |
            Humidity: {{ states('input_number.climate_occupied_humidity_max') }}%
          data:
            priority: normal

  reset_climate_controls_to_defaults:
    alias: "Reset Climate Controls to Defaults"
    icon: mdi:restore
    sequence:
      # Temperature defaults
      - service: input_number.set_value
        target:
          entity_id: input_number.foundation_cooling_target_home
        data:
          value: 74.0

      - service: input_number.set_value
        target:
          entity_id: input_number.foundation_cooling_target_sleep
        data:
          value: 73.0

      # Humidity defaults
      - service: input_number.set_value
        target:
          entity_id: input_number.foundation_humidity_max_home
        data:
          value: 55

      # Dew point defaults
      - service: input_number.set_value
        target:
          entity_id: input_number.climate_dew_point_limit
        data:
          value: 55

      - service: input_number.set_value
        target:
          entity_id: input_number.climate_dew_point_emergency
        data:
          value: 57

      - service: input_number.set_value
        target:
          entity_id: input_number.climate_dew_point_lockout
        data:
          value: 60

      # Notification
      - service: notify.mobile_app_drews_iphone
        data:
          title: "Climate Controls Reset"
          message: "All climate control values restored to factory defaults: Home 74°F, Sleep 73°F, Humidity 55%, Dew Point Limits 55/57/60°F"
          data:
            push:
              sound: default

timer:
  hvac_manual_override_timer:
    name: HVAC Manual Override Timer
    duration: "00:45:00"
  hvac_runtime_monitor:
    name: HVAC Runtime Monitor
    duration: "00:45:00"
  hvac_cooldown_timer:
    name: HVAC Cooldown Timer
    duration: "00:10:00"
  dehumidifier_runtime_monitor:
    name: Dehumidifier Runtime Monitor
    duration: "01:30:00"
  dehumidifier_cooldown_timer:
    name: Dehumidifier Cooldown Timer
    duration: "00:10:00"
  emergency_lockout_timer:
    name: Emergency Lockout Timer
    duration: "01:00:00"

counter:
  equipment_arbitration_emergencies:
    name: Equipment Arbitration Emergency Events
    icon: mdi:alert-circle
    initial: 0

automation:
  - id: climate_track_hvac_cycle_times
    alias: Climate Track HVAC Cycle Times
    description: Update helper timestamps when the thermostat starts or stops cooling.
    trigger:
      - platform: state
        entity_id: climate.thermostat
        attribute: hvac_action
    condition: []
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.get('hvac_action', '') == 'cooling' }}"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hvac_last_cool_start
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              # Start runtime monitor when cooling begins
              - service: timer.start
                target:
                  entity_id: timer.hvac_runtime_monitor
              # Cancel cooldown timer when cooling starts
              - service: timer.cancel
                target:
                  entity_id: timer.hvac_cooldown_timer
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.get('hvac_action', '') in ['idle', 'fan', 'off'] }}"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hvac_last_cool_stop
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              # Stop runtime monitor and start cooldown when cooling stops
              - service: timer.cancel
                target:
                  entity_id: timer.hvac_runtime_monitor
              - service: timer.start
                target:
                  entity_id: timer.hvac_cooldown_timer
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.get('hvac_action', '') == 'cooling' }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hvac_emergency_override
    mode: queued

  - id: climate_track_dehumidifier_cycle_times
    alias: Climate Track Dehumidifier Cycle Times
    description: Maintain runtime metadata for the Aprilaire and enforce rest windows.
    trigger:
      - platform: state
        entity_id: switch.dehumidifier_relay_l1
    condition: []
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.dehumidifier_relay_l1
                state: 'on'
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.dehumidifier_last_start
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              # Start runtime monitor when dehumidifier turns on
              - service: timer.start
                target:
                  entity_id: timer.dehumidifier_runtime_monitor
              # Cancel cooldown timer when dehumidifier starts
              - service: timer.cancel
                target:
                  entity_id: timer.dehumidifier_cooldown_timer
          - conditions:
              - condition: state
                entity_id: switch.dehumidifier_relay_l1
                state: 'off'
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.dehumidifier_last_stop
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              # Stop runtime monitor and start cooldown when dehumidifier stops
              - service: timer.cancel
                target:
                  entity_id: timer.dehumidifier_runtime_monitor
              - service: timer.start
                target:
                  entity_id: timer.dehumidifier_cooldown_timer
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.dehumidifier_relay_l1
                state: 'on'
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.thermostat_previous_fan_mode
                data:
                  value: "{{ state_attr('climate.thermostat', 'fan_mode') | default('auto') }}"
              - service: climate.set_fan_mode
                target:
                  entity_id: climate.thermostat
                data:
                  fan_mode: on
          - conditions:
              - condition: state
                entity_id: switch.dehumidifier_relay_l1
                state: 'off'
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ is_state('input_text.thermostat_previous_fan_mode', 'on') }}"
                    sequence:
                      - service: climate.set_fan_mode
                        target:
                          entity_id: climate.thermostat
                        data:
                          fan_mode: on
                  - conditions:
                      - condition: template
                        value_template: "{{ is_state('input_text.thermostat_previous_fan_mode', 'circulate') }}"
                    sequence:
                      - service: climate.set_fan_mode
                        target:
                          entity_id: climate.thermostat
                        data:
                          fan_mode: circulate
                default:
                  - service: climate.set_fan_mode
                    target:
                      entity_id: climate.thermostat
                    data:
                      fan_mode: auto
    mode: queued

  - id: climate_hvac_runtime_guard
    alias: Climate HVAC Runtime Guard
    description: Enforce the cooling runtime cap and schedule a rest window when exceeded.
    trigger:
      - platform: state
        entity_id: binary_sensor.hvac_runtime_exceeded
        to: 'on'
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_pause
        state: 'off'
      - condition: state
        entity_id: input_boolean.hvac_emergency_override
        state: 'off'
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ state_attr('climate.thermostat', 'hvac_action') == 'cooling' }}"
              - condition: template
                value_template: >-
                  {% set last_start = states('input_datetime.hvac_last_cool_start') %}
                  {% if last_start in ['unknown', 'unavailable', ''] %}
                    false
                  {% else %}
                    {% set elapsed = (as_timestamp(now()) - as_timestamp(last_start)) / 60 %}
                    {% set cap = states('input_number.climate_hvac_runtime_cap') | float(45) %}
                    {{ elapsed >= cap }}
                  {% endif %}
            sequence:
              - service: climate.turn_off
                target:
                  entity_id: climate.thermostat
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hvac_last_cool_stop
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - service: notify.notify
                data:
                  title: "HVAC Runtime Guard"
                  message: >-
                    Cooling runtime exceeded
                    {{ states('input_number.climate_hvac_runtime_cap') | int }} minutes.
                    Thermostat turned off to protect the compressor and honor the
                    {{ states('input_number.climate_hvac_rest_window') | int }} minute rest window.
        default: []
    mode: single

  - id: climate_dehumidifier_runtime_guard
    alias: Climate Dehumidifier Runtime Guard
    description: Enforce maximum continuous runtime for the Aprilaire and surface alerts when exceeded.
    trigger:
      - platform: state
        entity_id: switch.dehumidifier_relay_l1
        to: 'on'
      - platform: time_pattern
        minutes: "/5"
    condition: []
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.dehumidifier_relay_l1
                state: 'on'
              - condition: template
                value_template: >-
                  {% set last_start = states('input_datetime.dehumidifier_last_start') %}
                  {% set cap = states('input_number.climate_dehumidifier_runtime_cap') | float(90) %}
                  {% if last_start in ['unknown', 'unavailable', ''] %}
                    false
                  {% else %}
                    {{ (as_timestamp(now()) - as_timestamp(last_start)) / 60 >= cap }}
                  {% endif %}
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.dehumidifier_runtime_lockout_active
              - repeat:
                  count: 3
                  sequence:
                    - service: switch.turn_off
                      target:
                        entity_id: switch.dehumidifier_relay_l1
                    - delay:
                        seconds: 2
              - service: homeassistant.update_entity
                target:
                  entity_id: switch.dehumidifier_relay_l1
              - wait_template: "{{ is_state('switch.dehumidifier_relay_l1', 'off') }}"
                timeout: "00:01:00"
                continue_on_timeout: true
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.dehumidifier_last_stop
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ wait.completed }}"
                    sequence:
                      - service: notify.notify
                        data:
                          title: "Dehumidifier Runtime Guard"
                          message: >-
                            Aprilaire runtime exceeded
                            {{ states('input_number.climate_dehumidifier_runtime_cap') | int }} minutes.
                            Relay reports OFF; enforcing a
                            {{ states('input_number.climate_dehumidifier_rest_window') | int }} minute
                            rest window before restoring automation control.
                  - conditions:
                      - condition: template
                        value_template: "{{ not wait.completed }}"
                    sequence:
                      - service: notify.notify
                        data:
                          title: "Dehumidifier Runtime Guard"
                          message: >-
                            Aprilaire runtime exceeded
                            {{ states('input_number.climate_dehumidifier_runtime_cap') | int }} minutes,
                            but the relay still reports ON after multiple shutdown attempts.
                            Check Zigbee2MQTT connectivity or power the Aprilaire down manually;
                            the rest window remains in effect once connectivity returns.
              - service: script.reset_all_overrides
        default: []
    mode: single

  - id: climate_release_dehumidifier_runtime_guard
    alias: Climate Release Dehumidifier Runtime Guard
    description: Clear the runtime lockout once the rest window expires.
    trigger:
      - platform: state
        entity_id: binary_sensor.dehumidifier_rest_window_active
        to: 'off'
    condition:
      - condition: state
        entity_id: input_boolean.dehumidifier_runtime_lockout_active
        state: 'on'
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.dehumidifier_runtime_lockout_active
      - service: notify.notify
        data:
          title: "Dehumidifier Runtime Guard"
          message: Rest window satisfied; automated dehumidifier control has resumed.
    mode: single

  - id: dehumidifier_outlet_keeper
    alias: "Dehumidifier Outlet Keeper"
    description: "Ensure smart outlet is ON when relay is active or when outlet is turned off"
    trigger:
      - platform: state
        entity_id: switch.dehumidifier_relay_l1
        to: 'on'
        id: relay_on
      - platform: state
        entity_id: switch.dehumidifier_outlet_switch
        to: 'off'
        for:
          seconds: 10
        id: outlet_off
    condition:
      - condition: state
        entity_id: switch.dehumidifier_relay_l1
        state: 'on'
    action:
      - service: switch.turn_on
        target:
          entity_id: switch.dehumidifier_outlet_switch
      - choose:
          - conditions:
              - condition: trigger
                id: outlet_off
            sequence:
              - service: notify.notify
                data:
                  title: "🔌 Dehumidifier Outlet Auto-Recovery"
                  message: >-
                    Smart outlet was OFF while relay was active.
                    Automatically turned outlet back ON to restore power.
                    Relay has been signaling ON but E130 had no power for 10+ seconds.
        default: []
    mode: single

  - id: climate_override_rest_release
    alias: Climate Override Rest Release
    description: Allow manual overrides to bypass equipment rest windows immediately.
    trigger:
      - platform: state
        entity_id:
          - input_boolean.manual_humidity_emergency_override
          - input_boolean.hvac_emergency_override
        to: 'on'
    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.entity_id == 'input_boolean.manual_humidity_emergency_override' }}"
              - condition: state
                entity_id: input_boolean.dehumidifier_runtime_lockout_active
                state: 'off'
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.dehumidifier_last_stop
                data:
                  datetime: "{{ (now() - timedelta(minutes=20)).strftime('%Y-%m-%d %H:%M:%S') }}"
              - service: timer.start
                target:
                  entity_id: timer.hvac_manual_override_timer
                data:
                  duration: "01:00:00"
          - conditions:
              - condition: template
                value_template: "{{ trigger.entity_id == 'input_boolean.hvac_emergency_override' }}"
            sequence:
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.hvac_last_cool_stop
                data:
                  datetime: "{{ (now() - timedelta(minutes=20)).strftime('%Y-%m-%d %H:%M:%S') }}"

  - id: climate_manual_override_timer_guard
    alias: Climate Manual Override Timer Guard
    description: Ensure the manual override timer refreshes whenever the emergency toggle is used.
    trigger:
      - platform: state
        entity_id: input_boolean.manual_humidity_emergency_override
        to: 'on'
    action:
      - service: timer.start
        target:
          entity_id: timer.hvac_manual_override_timer
        data:
          duration: "01:00:00"

  - id: climate_comfort_setpoint_manager
    alias: Climate Comfort Setpoint Manager
    description: Bias thermostat setpoints toward the 72°–76°F occupied comfort band.
    trigger:
      - platform: time_pattern
        minutes: "/5"
      - platform: state
        entity_id: binary_sensor.climate_any_room_occupied
        for: "00:02:00"
      - platform: state
        entity_id: sensor.average_house_temperature_combined
        for: "00:02:00"
      - platform: state
        entity_id: sensor.priority_dew_point_enhanced
        for: "00:02:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_pause
        state: 'off'
      - condition: state
        entity_id: input_boolean.hvac_emergency_override
        state: 'off'
    action:
      - variables:
          low: "{{ states('input_number.climate_occupied_cooling_low') | float(72) }}"
          high: "{{ states('input_number.climate_occupied_cooling_high') | float(76) }}"
          vacant: "{{ states('input_number.climate_unoccupied_cooling_target') | float(78) }}"
          current_mode: "{{ states('climate.thermostat') }}"
          target_temp: "{{ ((low | float) + (high | float)) / 2 }}"
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.climate_any_room_occupied
                state: 'on'
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ current_mode == 'cool' }}"
                    sequence:
                      - service: climate.set_temperature
                        target:
                          entity_id: climate.thermostat
                        data:
                          temperature: "{{ target_temp }}"
          - conditions:
              - condition: state
                entity_id: binary_sensor.climate_any_room_occupied
                state: 'off'
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ current_mode == 'cool' }}"
                    sequence:
                      - service: climate.set_temperature
                        target:
                          entity_id: climate.thermostat
                        data:
                          temperature: "{{ vacant | float }}"
    mode: queued

  - id: climate_dew_point_dehumidifier_control
    alias: Climate Dew Point Dehumidifier Control
    description: Stage dehumidifier runtime against dew point guardrails with rest protection.
    trigger:
      - platform: numeric_state
        entity_id: sensor.max_indoor_dew_point_enhanced
        above: 54
      - platform: numeric_state
        entity_id: sensor.max_indoor_dew_point_enhanced
        below: 53
      - platform: state
        entity_id: binary_sensor.humidity_emergency_condition
      - platform: state
        entity_id: binary_sensor.humidity_lockout_condition
      - platform: state
        entity_id: input_boolean.manual_humidity_emergency_override
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_pause
        state: 'off'
      - condition: state
        entity_id: input_boolean.dehumidifier_service_mode
        state: 'off'
    action:
      - variables:
          max_dew_point: "{{ states('sensor.max_indoor_dew_point_enhanced') | float(0) }}"
          priority_dew_point: "{{ states('sensor.priority_dew_point_enhanced') | float(0) }}"
          limit: "{{ states('input_number.climate_dew_point_limit') | float(55) }}"
          emergency: "{{ states('input_number.climate_dew_point_emergency') | float(57) }}"
          lockout: "{{ states('input_number.climate_dew_point_lockout') | float(60) }}"
          manual_override_active: "{{ is_state('input_boolean.manual_humidity_emergency_override', 'on') }}"
          hvac_active: "{{ state_attr('climate.thermostat', 'hvac_action') == 'cooling' }}"
          runtime_lockout_active: "{{ is_state('input_boolean.dehumidifier_runtime_lockout_active', 'on') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ manual_override_active and not runtime_lockout_active }}"
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.dehumidifier_relay_l1
          - conditions:
              - condition: template
                value_template: >-
                  {{ max_dew_point >= lockout or
                     is_state('binary_sensor.humidity_lockout_condition', 'on') }}
              - condition: state
                entity_id: binary_sensor.dehumidifier_rest_window_active
                state: 'off'
              - condition: state
                entity_id: binary_sensor.dehumidifier_minimum_run_satisfied
                state: 'on'
              - condition: state
                entity_id: input_boolean.dehumidifier_runtime_lockout_active
                state: 'off'
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.dehumidifier_relay_l1
          - conditions:
              - condition: template
                value_template: >-
                  {{ (priority_dew_point >= limit and not hvac_active)
                     or (max_dew_point >= emergency) }}
              - condition: state
                entity_id: binary_sensor.dehumidifier_rest_window_active
                state: 'off'
              - condition: state
                entity_id: input_boolean.dehumidifier_runtime_lockout_active
                state: 'off'
            sequence:
              - service: switch.turn_on
                target:
                  entity_id: switch.dehumidifier_relay_l1
          - conditions:
              - condition: template
                value_template: "{{ priority_dew_point <= (limit - 1) }}"
              - condition: state
                entity_id: input_boolean.manual_humidity_emergency_override
                state: 'off'
              - condition: state
                entity_id: binary_sensor.dehumidifier_minimum_run_satisfied
                state: 'on'
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.dehumidifier_relay_l1
        default:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hvac_active and max_dew_point < emergency and not manual_override_active }}"
                sequence:
                  - condition: state
                    entity_id: switch.dehumidifier_relay_l1
                    state: 'on'
                  - condition: state
                    entity_id: binary_sensor.dehumidifier_minimum_run_satisfied
                    state: 'on'
                  - service: switch.turn_off
                    target:
                      entity_id: switch.dehumidifier_relay_l1
    mode: queued

  - id: climate_humidity_emergency_coordination
    alias: Climate Humidity Emergency Coordination
    description: Permit dual HVAC and dehumidifier operation during dew point emergencies and notify when resolved.
    trigger:
      - platform: state
        entity_id: binary_sensor.humidity_emergency_condition
      - platform: state
        entity_id: binary_sensor.humidity_lockout_condition
    condition: []
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.humidity_emergency_condition
                state: 'on'
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hvac_emergency_override
              - service: climate.set_hvac_mode
                target:
                  entity_id: climate.thermostat
                data:
                  hvac_mode: cool
              - service: climate.set_temperature
                target:
                  entity_id: climate.thermostat
                data:
                  temperature: "{{ (states('input_number.climate_occupied_cooling_low') | float(72)) }}"
              - service: switch.turn_on
                target:
                  entity_id: switch.dehumidifier_relay_l1
              - service: notify.notify
                data:
                  title: "Humidity Emergency"
                  message: >-
                    Dew point spiked to {{ states('sensor.max_indoor_dew_point_enhanced') }}°F.
                    Dual HVAC + Aprilaire runtime authorized until conditions normalize.
          - conditions:
              - condition: state
                entity_id: binary_sensor.humidity_emergency_condition
                state: 'off'
                for:
                  minutes: 5
            sequence:
              - condition: state
                entity_id: input_boolean.manual_humidity_emergency_override
                state: 'off'
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hvac_emergency_override
              - service: notify.notify
                data:
                  title: "Humidity Emergency Cleared"
                  message: >-
                    Dew point recovered to {{ states('sensor.max_indoor_dew_point_enhanced') }}°F.
                    Reverting to staged control.
    mode: queued

  - id: climate_dehumidifier_service_mode_protection
    alias: Climate Dehumidifier Service Mode Protection
    description: Automatically pause automation commands while servicing the Aprilaire.
    trigger:
      - platform: state
        entity_id: input_boolean.dehumidifier_service_mode
    condition: []
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.dehumidifier_service_mode
                state: 'on'
            sequence:
              - service: switch.turn_off
                target:
                  entity_id: switch.dehumidifier_relay_l1
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.climate_automation_pause
          - conditions:
              - condition: state
                entity_id: input_boolean.dehumidifier_service_mode
                state: 'off'
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.climate_automation_pause
    mode: restart

  - id: climate_manual_override_timer_complete
    alias: Climate Manual Override Timer Complete
    description: Clear manual override flags when the guard timer expires.
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hvac_manual_override_timer
    condition: []
    action:
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.manual_humidity_emergency_override
            - input_boolean.hvac_emergency_override
      - service: notify.notify
        data:
          title: "Manual Override Window Closed"
          message: Automatic climate orchestration restored after override timer completion.
    mode: restart

  - id: climate_automation_pause_guardrail
    alias: Climate Automation Pause Guardrail
    description: Notify homeowners if automations remain paused for more than one hour.
    trigger:
      - platform: state
        entity_id: input_boolean.climate_automation_pause
        to: 'on'
        for:
          hours: 1
    condition: []
    action:
      - service: notify.notify
        data:
          title: "Climate Automations Paused"
          message: >-
            Pause switch has been active for over an hour.
            Review manual settings or reset automations when ready.
    mode: single

  - id: climate_hvac_cooldown_release
    alias: Climate HVAC Cooldown Release
    description: Prevent automation-driven cooldown releases before minimum runtime.
    trigger:
      - platform: numeric_state
        entity_id: sensor.average_house_dew_point_enhanced
        below: 54
      - platform: numeric_state
        entity_id: sensor.average_house_temperature_combined
        below: 73
    condition:
      - condition: state
        entity_id: climate.thermostat
        state: cool
      - condition: state
        entity_id: binary_sensor.hvac_minimum_run_satisfied
        state: 'on'
    action:
      - condition: state
        entity_id: input_boolean.hvac_emergency_override
        state: 'off'
      - service: climate.set_temperature
        target:
          entity_id: climate.thermostat
        data:
          temperature: "{{ states('input_number.climate_occupied_cooling_high') | float(76) }}"
    mode: queued

  - id: track_equipment_arbitration_emergencies
    alias: "Track Equipment Arbitration Emergencies"
    description: "Increment counter and log when emergency coordination activates"
    trigger:
      - platform: state
        entity_id: binary_sensor.humidity_emergency_condition
        to: 'on'
      - platform: state
        entity_id: input_boolean.hvac_emergency_override
        to: 'on'
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state != trigger.from_state.state }}"
    action:
      - service: counter.increment
        target:
          entity_id: counter.equipment_arbitration_emergencies
      - service: logbook.log
        data:
          name: "Equipment Arbitration Emergency"
          message: >
            Emergency #{{ states('counter.equipment_arbitration_emergencies') }} -
            Dew point: {{ states('sensor.max_indoor_dew_point_enhanced') }}°F
          entity_id: binary_sensor.equipment_arbitration_emergency_active
    mode: single

  - id: reset_equipment_arbitration_emergencies
    alias: "Reset Equipment Arbitration Emergency Counter"
    description: "Auto-reset counter when all emergency conditions clear"
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.humidity_emergency_condition
          - binary_sensor.humidity_emergency_condition_2
          - input_boolean.hvac_emergency_override
          - input_boolean.manual_humidity_emergency_override
        to: 'off'
        for:
          minutes: 5
    condition:
      - condition: and
        conditions:
          - condition: state
            entity_id: binary_sensor.humidity_emergency_condition
            state: 'off'
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.humidity_emergency_condition_2
                state: 'off'
              - condition: state
                entity_id: binary_sensor.humidity_emergency_condition_2
                state: 'unavailable'
          - condition: state
            entity_id: input_boolean.hvac_emergency_override
            state: 'off'
          - condition: state
            entity_id: input_boolean.manual_humidity_emergency_override
            state: 'off'
          - condition: numeric_state
            entity: counter.equipment_arbitration_emergencies
            above: 0
    action:
      - service: counter.reset
        target:
          entity_id: counter.equipment_arbitration_emergencies
      - service: logbook.log
        data:
          name: "Equipment Arbitration System"
          message: "Emergency counter auto-reset - All conflicts resolved"
          entity_id: counter.equipment_arbitration_emergencies
    mode: single
