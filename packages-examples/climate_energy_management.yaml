# -----------------------------------------------------------------------------
# ENERGY MANAGEMENT SCRIPTS
# -----------------------------------------------------------------------------
script:
  # ENERGY STATUS UPDATE
  energy_management_status_update:
    alias: "Update Energy Management Status"
    description: "Refresh all energy management sensors and provide status summary"
    sequence:
      - action: homeassistant.update_entity
        entity_id:
          - sensor.climate_energy_total_power_hybrid
          - sensor.energy_validation_total_daily_cost
          - sensor.gulf_coast_energy_efficiency_score
          - sensor.phase3_combined_daily_savings
      - delay:
          seconds: 3
      - action: persistent_notification.create
        data:
          title: "⚡ Energy Management Status"
          message: >
            Total Power: {{ states('sensor.climate_energy_total_power_hybrid') }}W
            Daily Cost: ${{ states('sensor.energy_validation_total_daily_cost') }}
            Efficiency Score: {{ states('sensor.gulf_coast_energy_efficiency_score') }}%

            Daily Savings: {{ states('sensor.phase3_combined_daily_savings') }} kWh
            Annual Progress: {{ state_attr('sensor.phase3_combined_daily_savings', 'annual_savings_projection') }}
            Target Progress: {{ state_attr('sensor.phase3_combined_daily_savings', 'target_progress') }}
          notification_id: energy_management_status

  # ENABLE ALL ENERGY TRACKING
  energy_tracking_enable:
    alias: "Enable Energy Tracking"
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.climate_energy_management_master
            - input_boolean.climate_energy_real_time_monitoring
            - input_boolean.climate_energy_cost_optimization
            - input_boolean.climate_energy_efficiency_analytics
            - input_boolean.energy_tracking_enabled
            - input_boolean.cost_monitoring_enabled
            - input_boolean.savings_estimation_enabled
      - action: notify.mobile_app_drews_iphone
        data:
          title: "⚡ Energy Management Enabled"
          message: "All energy tracking systems activated"

  # DISABLE ALL ENERGY TRACKING
  energy_tracking_disable:
    alias: "Disable Energy Tracking"
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.climate_energy_management_master
            - input_boolean.climate_energy_real_time_monitoring
            - input_boolean.climate_energy_cost_optimization
            - input_boolean.climate_energy_efficiency_analytics
            - input_boolean.energy_tracking_enabled
            - input_boolean.cost_monitoring_enabled
            - input_boolean.savings_estimation_enabled
      - action: notify.mobile_app_drews_iphone
        data:
          title: "⚡ Energy Management Disabled"
          message: "All energy tracking systems deactivated"

  # ENERGY STATUS REPORT
  energy_status_report:
    alias: "Energy Status Report"
    sequence:
      - action: notify.mobile_app_drews_iphone
        data:
          title: "⚡ Energy Status Report"
          message: >
            Current Status: {{ states('sensor.climate_energy_status') }}
            Daily Cost: ${{ states('sensor.daily_climate_cost_estimate') }}
            Monthly Projection: ${{ states('sensor.monthly_climate_cost_projection') }}

            Phase 3 Savings: {{ states('sensor.phase3_combined_daily_savings') }} kWh/day
            Annual Progress: {{ state_attr('sensor.phase3_combined_daily_savings', 'annual_savings_projection') }}

            Gulf Coast Efficiency: {{ states('sensor.gulf_coast_energy_efficiency_score') }}%
            Rate: {{ states('input_number.electricity_rate') }}¢/kWh
            Budget: ${{ states('input_number.monthly_climate_budget') }}

  # ACTIVATE SAVINGS MODE
  activate_savings_mode:
    alias: "Activate Savings Mode"
    sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.occupancy_mode
        data:
          option: "Away"
      - action: notify.mobile_app_drews_iphone
        data:
          title: "💰 Savings Mode Activated"
          message: >
            Switched to Away mode for energy savings

            Current daily cost: ${{ states('sensor.daily_climate_cost_estimate') }}
            Gulf Coast efficiency: {{ states('sensor.gulf_coast_energy_efficiency_score') }}%

