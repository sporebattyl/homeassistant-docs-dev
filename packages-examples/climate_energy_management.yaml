  phase3b_humidity_coordination_monthly_savings:
    source: sensor.phase3b_humidity_coordination_daily_savings
    cycle: monthly
    name: "Phase 3B Humidity Coordination Monthly Savings"

  phase3_combined_weekly_savings:
    source: sensor.phase3_combined_daily_savings
