        state: "{{ states('sensor.climate_guest_bathroom_humidity') | float(50) | round(0) }}"
        availability: "{{ not is_state('sensor.climate_guest_bathroom_humidity', 'unavailable') }}"

      - name: "TempHumidSensor8 Humidity"
