          {% endif %}
        attributes:
          purpose: "System Recovery Protocol"
          last_execution: "{{ states('input_datetime.climate_system_restart_last_run') }}"
          safety_critical: true

      - name: "Reset All Overrides Timestamp"
        # Entity: sensor.reset_all_overrides_timestamp
        unique_id: reset_all_overrides_timestamp
        state: >
          {% set last_run = states('input_datetime.reset_all_overrides_last_run') %}
          {% if last_run in ['unknown', 'unavailable', 'none'] %}
            Never executed
          {% else %}
            {% set run_time = strptime(last_run, '%Y-%m-%d %H:%M:%S') %}
            {{ run_time.strftime('%b %d, %I:%M %p') }}
          {% endif %}
        attributes:
          purpose: "Clear All Emergency States"
          last_execution: "{{ states('input_datetime.reset_all_overrides_last_run') }}"
          safety_critical: false

