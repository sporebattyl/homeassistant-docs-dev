          {% else %}mdi:walk{% endif %}
        availability: "{{ not is_state('binary_sensor.presencesensor3_motion', 'unknown') }}"

      - name: "Master Hallway Motion Enhanced"
        unique_id: presencesensor4_motion_enhanced
        state: >
          {% if is_state('binary_sensor.presencesensor4_motion', 'on') %}
            Motion Detected
          {% elif is_state('binary_sensor.presencesensor4_motion', 'unavailable') %}
            Sensor Offline
          {% else %}
            No Motion
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.presencesensor4_motion', 'on') %}mdi:run
          {% elif is_state('binary_sensor.presencesensor4_motion', 'unavailable') %}mdi:motion-sensor-off
          {% else %}mdi:walk{% endif %}
        availability: "{{ not is_state('binary_sensor.presencesensor4_motion', 'unknown') }}"

      - name: "Master Bedroom Motion Enhanced"
        unique_id: presencesensor13_motion_enhanced
        state: >
          {% if is_state('binary_sensor.presencesensor13_motion', 'on') %}
            Motion Detected
          {% elif is_state('binary_sensor.presencesensor13_motion', 'unavailable') %}
            Sensor Offline
          {% else %}
            No Motion
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.presencesensor13_motion', 'on') %}mdi:run
          {% elif is_state('binary_sensor.presencesensor13_motion', 'unavailable') %}mdi:motion-sensor-off
          {% else %}mdi:walk{% endif %}
        availability: "{{ not is_state('binary_sensor.presencesensor13_motion', 'unknown') }}"

      # =======================================================================
      # EMERGENCY SCRIPT TIMESTAMP TRACKING (Phase 3.4)
      # =======================================================================
      # Track last execution time for emergency safety protocols

      - name: "Emergency Humidity Override Timestamp"
        # Entity: sensor.emergency_humidity_override_timestamp
        unique_id: emergency_humidity_override_timestamp
        state: >
          {% set last_run = states('input_datetime.emergency_humidity_override_last_run') %}
          {% if last_run in ['unknown', 'unavailable', 'none'] %}
            Never executed
          {% else %}
            {% set run_time = strptime(last_run, '%Y-%m-%d %H:%M:%S') %}
            {{ run_time.strftime('%b %d, %I:%M %p') }}
          {% endif %}
        attributes:
          purpose: "60% Humidity Emergency Protocol"
          last_execution: "{{ states('input_datetime.emergency_humidity_override_last_run') }}"
          safety_critical: true

      - name: "Emergency Cooling Boost Timestamp"
        # Entity: sensor.emergency_cooling_boost_timestamp
