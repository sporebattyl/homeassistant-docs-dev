            {{ run_time.strftime('%b %d, %I:%M %p') }}
          {% endif %}
        attributes:
          purpose: "Gulf Coast Heat Emergency Response"
          last_execution: "{{ states('input_datetime.emergency_cooling_boost_last_run') }}"
          safety_critical: true

      - name: "Climate System Restart Timestamp"
