  - sensor:
      # =======================================================================
      # ENVIRONMENTAL & SAFETY SENSORS - GULF COAST INTELLIGENCE
      # =======================================================================

      - name: "Environmental Intelligence Dashboard"
        unique_id: environmental_intelligence_status_dashboard
        state: >
          {% set temp = states('sensor.average_house_temperature_combined') | float(75) %}
          {% set humidity = states('sensor.average_house_humidity_combined') | float(50) %}
          {% set outdoor_temp = state_attr('weather.home', 'temperature') | default(80) %}
          {% if humidity > 60 %}
            Emergency: High Humidity ({{ humidity }}%)
          {% elif temp > 78 and outdoor_temp > 90 %}
            High Heat Stress Conditions
          {% elif humidity > 55 %}
            Elevated Humidity Warning
          {% else %}
            Normal Gulf Coast Conditions
          {% endif %}
        icon: >
          {% set humidity = states('sensor.average_house_humidity_combined') | float(50) %}
          {% if humidity > 60 %}mdi:alert-circle
          {% elif humidity > 55 %}mdi:weather-cloudy-alert
          {% else %}mdi:weather-partly-cloudy{% endif %}
        attributes:
          indoor_temperature: "{{ states('sensor.average_house_temperature_combined') }}°F"
          indoor_humidity: "{{ states('sensor.average_house_humidity_combined') }}%"
          outdoor_temperature: "{{ state_attr('weather.home', 'temperature') | default(80) }}°F"
          heat_stress_risk: >
            {% set temp = states('sensor.average_house_temperature_combined') | float(75) %}
            {% set outdoor_temp = state_attr('weather.home', 'temperature') | default(80) | float(80) %}
            {% if temp > 78 and outdoor_temp > 95 %}High
            {% elif temp > 76 and outdoor_temp > 90 %}Medium
            {% else %}Low{% endif %}
          humidity_ceiling: "60% (Gulf Coast Max)"

      - name: "Gulf Coast Heat Index Enhanced"
        unique_id: gulf_coast_heat_index_enhanced_dashboard
        unit_of_measurement: "°F"
        state: >
          {% set temp_f = states('sensor.average_house_temperature_combined') | float(75) %}
          {% set humidity = states('sensor.average_house_humidity_combined') | float(50) %}
          {% if temp_f < 80 or humidity < 40 %}
            {{ temp_f | round(0, default=75) }}
          {% else %}
            {% set c1 = -42.379 %}
            {% set c2 = 2.04901523 %}
            {% set c3 = 10.14333127 %}
            {% set c4 = -0.22475541 %}
            {% set c5 = -0.00683783 %}
            {% set c6 = -0.05481717 %}
            {% set c7 = 0.00122874 %}
            {% set c8 = 0.00085282 %}
            {% set c9 = -0.00000199 %}
            {% set hi = c1 + (c2 * temp_f) + (c3 * humidity) + (c4 * temp_f * humidity) +
                        (c5 * temp_f * temp_f) + (c6 * humidity * humidity) +
                        (c7 * temp_f * temp_f * humidity) + (c8 * temp_f * humidity * humidity) +
                        (c9 * temp_f * temp_f * humidity * humidity) %}
            {{ hi | round(0, default=80) }}
          {% endif %}
        attributes:
          indoor_temp: "{{ states('sensor.average_house_temperature_combined') }}°F"
          indoor_humidity: "{{ states('sensor.average_house_humidity_combined') }}%"
          risk_level: >
            {% set temp_f = states('sensor.average_house_temperature_combined') | float(75) %}
            {% set humidity = states('sensor.average_house_humidity_combined') | float(50) %}
            {% if temp_f < 80 %}Low Risk
            {% elif humidity > 60 %}High Risk - Emergency Dehumidification
            {% elif temp_f > 85 and humidity > 50 %}Caution - Monitor Closely
            {% else %}Normal{% endif %}

      - name: "Equipment Status Enhanced"
        unique_id: equipment_status_enhanced_dashboard
        state: >
          {% set hvac_status = state_attr('climate.thermostat', 'hvac_action') | default('idle') %}
          {% set dehumid_status = states('switch.dehumidifier_relay_l1') %}
          {% if hvac_status == 'cooling' and dehumid_status == 'on' %}
            Coordination Active (Both Running)
          {% elif hvac_status == 'cooling' %}
            AC Cooling Active
          {% elif dehumid_status == 'on' %}
            Dehumidifier Active
          {% elif hvac_status == 'heating' %}
            Heating Active
          {% else %}
            All Equipment Standby
          {% endif %}
        icon: >
          {% set hvac_status = state_attr('climate.thermostat', 'hvac_action') | default('idle') %}
          {% set dehumid_status = states('switch.dehumidifier_relay_l1') %}
          {% if hvac_status == 'cooling' and dehumid_status == 'on' %}mdi:cog-sync
          {% elif hvac_status == 'cooling' %}mdi:snowflake
          {% elif dehumid_status == 'on' %}mdi:air-humidifier
          {% elif hvac_status == 'heating' %}mdi:fire
          {% else %}mdi:power-standby{% endif %}
        attributes:
          hvac_action: "{{ state_attr('climate.thermostat', 'hvac_action') | default('idle') }}"
          dehumidifier_state: "{{ states('switch.dehumidifier_relay_l1') }}"
          coordination_status: >
            {% set hvac_status = state_attr('climate.thermostat', 'hvac_action') | default('idle') %}
            {% set dehumid_status = states('switch.dehumidifier_relay_l1') %}
            {% if hvac_status == 'cooling' and dehumid_status == 'on' %}
              Potential Conflict - Monitor Equipment
            {% else %}
              Normal Operation - No Conflicts
            {% endif %}

      - name: "Energy Cost Daily Projection"
        unique_id: energy_cost_daily_projection_dashboard
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set hvac_runtime = states('sensor.ml14xc1_daily_runtime_hours') | float(0) %}
          {% set dehumid_runtime = states('sensor.e130_daily_runtime_hours') | float(0) %}
          {% set hvac_power = 3.5 %}
          {% set dehumid_power = 0.8 %}
          {% set electricity_rate_cents = states('input_number.electricity_rate') | float(18.0) %}
          {% set cost_per_kwh = electricity_rate_cents / 100 %}
          {% set hvac_cost = hvac_runtime * hvac_power * cost_per_kwh %}
          {% set dehumid_cost = dehumid_runtime * dehumid_power * cost_per_kwh %}
          {{ (hvac_cost + dehumid_cost) | round(2, default=0) }}
        attributes:
          hvac_cost: >
            {% set runtime = states('sensor.ml14xc1_daily_runtime_hours') | float(0) %}
            {% set electricity_rate_cents = states('input_number.electricity_rate') | float(18.0) %}
            {% set cost_per_kwh = electricity_rate_cents / 100 %}
            {{ (runtime * 3.5 * cost_per_kwh) | round(2, default=0) }}
          dehumidifier_cost: >
            {% set runtime = states('sensor.e130_daily_runtime_hours') | float(0) %}
            {% set electricity_rate_cents = states('input_number.electricity_rate') | float(18.0) %}
            {% set cost_per_kwh = electricity_rate_cents / 100 %}
            {{ (runtime * 0.8 * cost_per_kwh) | round(2, default=0) }}
          total_kwh: >
            {% set hvac_runtime = states('sensor.ml14xc1_daily_runtime_hours') | float(0) %}
            {% set dehumid_runtime = states('sensor.e130_daily_runtime_hours') | float(0) %}
            {{ ((hvac_runtime * 3.5) + (dehumid_runtime * 0.8)) | round(2, default=0) }}
          cost_per_kwh: "${{ (states('input_number.electricity_rate') | float(18.0) / 100) | round(3) }}"
          electricity_rate: "{{ states('input_number.electricity_rate') }}¢/kWh"

      - name: "Energy Savings Annual Progress"
        unique_id: energy_savings_annual_progress_dashboard
        unit_of_measurement: "$"
        device_class: monetary
        state: >
          {% set daily_cost = states('sensor.energy_cost_daily_projection') | float(5.0) %}
          {% set baseline_daily = 6.5 %}  {# Before optimization baseline #}
          {% set daily_savings = baseline_daily - daily_cost %}
          {% set annual_savings = daily_savings * 365 %}
          {{ annual_savings | round(0, default=0) }}
        attributes:
          daily_savings: >
            {% set daily_cost = states('sensor.energy_cost_daily_projection') | float(5.0) %}
            {% set baseline_daily = 6.5 %}
            {{ (baseline_daily - daily_cost) | round(2, default=0) }}
          target_annual_savings: "$548"
          progress_percent: >
            {% set daily_cost = states('sensor.energy_cost_daily_projection') | float(5.0) %}
            {% set baseline_daily = 6.5 %}
            {% set daily_savings = baseline_daily - daily_cost %}
            {% set annual_savings = daily_savings * 365 %}
            {{ ((annual_savings / 548) * 100) | round(0, default=0) }}%
          current_efficiency: >
            {% set daily_cost = states('sensor.energy_cost_daily_projection') | float(5.0) %}
            {% set baseline_daily = 6.5 %}
            {% if daily_cost < baseline_daily %}Exceeding Target
            {% else %}Below Target{% endif %}

      - name: "System Health Gauge"
        # Entity: sensor.system_health_gauge
        unique_id: system_health_gauge_numeric
        unit_of_measurement: "%"
        device_class: battery
        state: >
          {% set health_state = states('sensor.foundation_system_health') %}
          {% set uptime = states('sensor.system_uptime_percentage') | float(100) %}
          {% set climate_score = states('sensor.climate_system_health_score') | float(100) %}
          {% if health_state == 'excellent' and uptime >= 99.5 %}100
          {% elif health_state == 'excellent' %}95
          {% elif health_state == 'good' and uptime >= 99.0 %}90
          {% elif health_state == 'good' %}85
          {% elif health_state == 'warning' %}60
          {% elif health_state == 'poor' %}45
          {% elif health_state == 'critical' %}30
          {% elif health_state == 'offline' %}0
          {% else %}{{ climate_score | round(0) if climate_score > 0 else 75 }}
          {% endif %}
        attributes:
          text_status: "{{ states('sensor.foundation_system_health') }}"
          climate_health_score: "{{ states('sensor.climate_system_health_score') }}%"
          system_uptime: "{{ states('sensor.system_uptime_percentage') }}%"
          uptime_target_met: "{{ states('binary_sensor.uptime_target_met') }}"
          available_sensors: "{{ state_attr('sensor.foundation_system_health', 'available_sensors') | default(15) }}"
          foundation_status: >-
            {{ state_attr('sensor.foundation_system_health', 'foundation_status')
               | default('Operational') }}
          last_updated: "{{ now().strftime('%I:%M %p') }}"
          calculation: "Combined foundation health, climate score, and uptime metrics"

      # =======================================================================
      # ANALYTICS TAB SENSORS - ENERGY & PERFORMANCE MONITORING
      # =======================================================================

      - name: "Equipment Arbitration Effectiveness"
        unique_id: equipment_arbitration_effectiveness
        unit_of_measurement: "%"
        state: >
          {% set hvac_state = state_attr('climate.thermostat', 'hvac_action') | default('unknown') %}
          {% set dehumid_state = states('switch.dehumidifier_relay_l1') %}
          {% if hvac_state == 'cooling' and dehumid_state == 'on' %}
            85
          {% elif hvac_state == 'cooling' or dehumid_state == 'on' %}
            95
          {% else %}
            100
          {% endif %}
        attributes:
          status: >
            {% set hvac_state = state_attr('climate.thermostat', 'hvac_action') | default('unknown') %}
            {% set dehumid_state = states('switch.dehumidifier_relay_l1') %}
            {% if hvac_state == 'cooling' and dehumid_state == 'on' %}
              ML14XC1/E130 Coordination Active - Monitor Energy Usage
            {% else %}
              ML14XC1/E130 Coordination Optimal - No Equipment Conflicts
            {% endif %}
          hvac_action: "{{ state_attr('climate.thermostat', 'hvac_action') | default('unknown') }}"
          dehumidifier_state: "{{ states('switch.dehumidifier_relay_l1') }}"
          equipment_context: "Lennox ML14XC1 Air Conditioner + Aprilaire E130 Dehumidifier"
          gulf_coast_optimization: "Prevents overcooling while maintaining 60% humidity ceiling"

      - name: "Coordination Energy Performance Score"
        unique_id: coordination_energy_performance_score
        unit_of_measurement: "%"
        state: >
          {% set efficiency = states('sensor.environmental_energy_efficiency_rating') | float(65) %}
          {% set arbitration = states('sensor.equipment_arbitration_effectiveness') | float(100) %}
          {{ ((efficiency + arbitration) / 2) | round(0, default=75) }}
        attributes:
          efficiency_component: "{{ states('sensor.environmental_energy_efficiency_rating') }}%"
          arbitration_component: "{{ states('sensor.equipment_arbitration_effectiveness') }}%"
          calculation: "Average of efficiency and arbitration scores"

      - name: "Energy Aware Dehumidifier Priority"
        unique_id: energy_aware_dehumidifier_priority
        state: >
          {% set humidity = states('sensor.average_house_humidity_combined') | float(50) %}
          {% if humidity > 58 %}
            High Priority
          {% elif humidity > 55 %}
            Medium Priority
          {% else %}
            Low Priority
          {% endif %}
        attributes:
          current_humidity: "{{ states('sensor.average_house_humidity_combined') }}%"
          threshold_status: >
            {% set humidity = states('sensor.average_house_humidity_combined') | float(50) %}
            {% if humidity > 60 %}
              Emergency Activation
            {% elif humidity > 58 %}
              Preventive Activation
            {% else %}
              Normal Operation
            {% endif %}
          gulf_coast_ceiling: "60%"

      - name: "Energy Aware HVAC Efficiency"
        unique_id: energy_aware_hvac_efficiency
        unit_of_measurement: "%"
        state: >
          {% set current_temp = states('sensor.average_house_temperature_combined') | float(75) %}
          {% set target_temp = states('input_number.foundation_cooling_target_home') | float(74) %}
          {% set temp_delta = (current_temp - target_temp) | abs %}
          {% if temp_delta <= 1.0 %}
            95
          {% elif temp_delta <= 2.0 %}
            85
          {% elif temp_delta <= 3.0 %}
            75
          {% else %}
            65
          {% endif %}
        attributes:
          temperature_variance: >-
            {{ ((states('sensor.average_house_temperature_combined') | float(75)) -
                (states('input_number.foundation_cooling_target_home') | float(74)))
                | round(1, default=0) }}°F
          current_temperature: "{{ states('sensor.average_house_temperature_combined') }}°F"
          target_temperature: "{{ states('input_number.foundation_cooling_target_home') }}°F"
          efficiency_grade: >
            {% set current_temp = states('sensor.average_house_temperature_combined') | float(75) %}
            {% set target_temp = states('input_number.foundation_cooling_target_home') | float(74) %}
            {% set temp_delta = (current_temp - target_temp) | abs %}
            {% if temp_delta <= 1.0 %}
              Excellent
            {% elif temp_delta <= 2.0 %}
              Good
            {% elif temp_delta <= 3.0 %}
              Fair
            {% else %}
              Needs Attention
            {% endif %}

      # =======================================================================
      # COORDINATION SENSORS - SYSTEM STATUS MONITORING
      # =======================================================================

      - name: "Coordination Energy Feedback Enhanced"
        unique_id: coordination_energy_feedback_enhanced
        state: >
          {% set phase3_active = is_state('binary_sensor.phase3_baseline_tracking_operational', 'on') %}
          {% set savings = states('sensor.phase3_combined_daily_savings') | float(0) %}
          {% if phase3_active and savings > 3.0 %}
            Excellent Performance - High Savings
          {% elif phase3_active and savings > 2.0 %}
            Good Performance - Moderate Savings
          {% elif phase3_active %}
            Basic Performance - Low Savings
          {% else %}
            System Inactive
          {% endif %}
        attributes:
          daily_savings: "{{ states('sensor.phase3_combined_daily_savings') }} kWh"
          phase3_status: "{{ states('binary_sensor.phase3_baseline_tracking_operational') }}"
          annual_projection: >-
            {{ state_attr('sensor.phase3_combined_daily_savings', 'annual_savings_projection')
               | default('N/A') }}

      # =======================================================================
      # MISSING DASHBOARD SUPPORT SENSORS
      # =======================================================================

      - name: "Energy Efficiency Percentage"
        unique_id: energy_efficiency_percentage_dashboard
        unit_of_measurement: "%"
        state: >
          {% set temp_efficiency = states('sensor.energy_aware_hvac_efficiency') | float(75) %}
          {% set arbitration_efficiency = states('sensor.equipment_arbitration_effectiveness') | float(95) %}
          {{ ((temp_efficiency + arbitration_efficiency) / 2) | round(1, default=75) }}
        attributes:
          temperature_efficiency: "{{ states('sensor.energy_aware_hvac_efficiency') }}%"
          arbitration_efficiency: "{{ states('sensor.equipment_arbitration_effectiveness') }}%"
          status: >
            {% set eff =
              ((states('sensor.energy_aware_hvac_efficiency') | float(75) +
                states('sensor.equipment_arbitration_effectiveness') | float(95)) / 2)
              | round(1, default=75) %}
            {% if eff >= 90 %}Excellent
            {% elif eff >= 80 %}Good
            {% elif eff >= 70 %}Fair
            {% else %}Needs Attention
            {% endif %}

      - name: "Safety System Status"
        unique_id: safety_system_status_dashboard
        state: >
          {% if not is_state('input_boolean.climate_safety_master_enabled', 'on') %}
            Safety Master Disabled
          {% elif is_state('binary_sensor.humidity_emergency_condition', 'on') %}
            Emergency: High Humidity
          {% elif is_state('binary_sensor.heat_index_emergency', 'on') %}
            Emergency: High Heat Index
          {% else %}
            All Safety Systems Normal
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.humidity_emergency_condition', 'on') or
                is_state('binary_sensor.heat_index_emergency', 'on') %}
            mdi:alert-circle
          {% elif is_state('input_boolean.climate_safety_master_enabled', 'on') %}
            mdi:shield-check
          {% else %}
            mdi:shield-off
          {% endif %}
        attributes:
          humidity_emergency: "{{ states('binary_sensor.humidity_emergency_condition') }}"
          heat_index_emergency: "{{ states('binary_sensor.heat_index_emergency') }}"
          safety_master_enabled: "{{ states('input_boolean.climate_safety_master_enabled') }}"
          current_humidity: "{{ states('sensor.average_house_humidity_combined') }}%"
          humidity_ceiling: "60%"

      # =======================================================================
      # HUMIDITY PRECISION STANDARDIZATION (Phase 3.2)
      # =======================================================================
      # Round all humidity displays to whole numbers for consistent UX

      - name: "TempHumidSensor1 Humidity"
        unique_id: temphumidsensor1_humidity_rounded
        unit_of_measurement: "%"
        device_class: humidity
        state: "{{ states('sensor.climate_living_room_humidity') | float(50) | round(0) }}"
