      - name: "TempHumidSensor3 Humidity"
        unique_id: temphumidsensor3_humidity_rounded
        unit_of_measurement: "%"
        device_class: humidity
        state: "{{ states('sensor.climate_outdoor_back_porch_humidity') | float(50) | round(0) }}"
        availability: "{{ not is_state('sensor.climate_outdoor_back_porch_humidity', 'unavailable') }}"

