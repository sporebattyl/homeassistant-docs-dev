        availability: "{{ not is_state('sensor.climate_office_humidity', 'unavailable') }}"

  - binary_sensor:
      # =======================================================================
      # DASHBOARD BINARY SENSORS - SYSTEM HEALTH & OCCUPANCY
      # =======================================================================

      - name: "Smart Occupancy Control Active"
        unique_id: smart_occupancy_control_active
        state: >
          {{ is_state('input_boolean.motion_enhanced_precision_cooling_enabled', 'on') and
             is_state('input_boolean.motion_follow_me_enabled', 'on') }}
        attributes:
          motion_cooling: "{{ states('input_boolean.motion_enhanced_precision_cooling_enabled') }}"
          follow_me: "{{ states('input_boolean.motion_follow_me_enabled') }}"
          precision_reduction: "{{ states('input_number.motion_precision_cooling_reduction') }}°F"

      - name: "Uptime Target Met"
        unique_id: uptime_target_met
        state: >
          {{ states('sensor.system_uptime_percentage') | float(100) >= 99.5 }}
        attributes:
          current_uptime: "{{ states('sensor.system_uptime_percentage') }}%"
          target: "99.5%"
          status: >
            {% if states('sensor.system_uptime_percentage') | float(100) >= 99.5 %}
              Target Met
            {% else %}
              Below Target
            {% endif %}

      - name: "Motion Follow-Me Display"
        unique_id: motion_follow_me_focus_display
        icon: mdi:target-account
        state: >
          {% set active = state_attr('binary_sensor.motion_follow_me_focus', 'active_zones') %}
          {% if active in [None, '', 'No motion detected'] %}
            Standby
          {% else %}
            {% set zones = active.split(',') %}
            {{ zones[0].strip() }}
          {% endif %}
        availability: >
          {{ states('binary_sensor.motion_follow_me_focus') not in ['unknown', 'unavailable', None] }}
        attributes:
          active_zones: >-
            {{ state_attr('binary_sensor.motion_follow_me_focus', 'active_zones')
               | default('No motion detected') }}
          sensors_online: >-
            {{ state_attr('binary_sensor.motion_follow_me_focus', 'sensors_online')
               | default('15/15') }}
          last_updated: "{{ now().strftime('%I:%M %p') }}"

      # =======================================================================
      # MOTION SENSOR UX ENHANCEMENT (Phase 3.3)
      # =======================================================================
      # Enhanced motion sensors with dynamic icons and clear status text

      - name: "Living Room Motion Enhanced"
        unique_id: presencesensor1_motion_enhanced
        state: >
          {% if is_state('binary_sensor.presencesensor1_motion', 'on') %}
            Motion Detected
          {% elif is_state('binary_sensor.presencesensor1_motion', 'unavailable') %}
            Sensor Offline
          {% else %}
            No Motion
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.presencesensor1_motion', 'on') %}mdi:run
          {% elif is_state('binary_sensor.presencesensor1_motion', 'unavailable') %}mdi:motion-sensor-off
          {% else %}mdi:walk{% endif %}
        availability: "{{ not is_state('binary_sensor.presencesensor1_motion', 'unknown') }}"

      - name: "Dining Room Motion Enhanced"
        unique_id: presencesensor2_motion_enhanced
        state: >
          {% if is_state('binary_sensor.presencesensor2_motion', 'on') %}
            Motion Detected
          {% elif is_state('binary_sensor.presencesensor2_motion', 'unavailable') %}
            Sensor Offline
          {% else %}
