          {% elif is_state('binary_sensor.presencesensor2_motion', 'unavailable') %}mdi:motion-sensor-off
          {% else %}mdi:walk{% endif %}
        availability: "{{ not is_state('binary_sensor.presencesensor2_motion', 'unknown') }}"

      - name: "Kitchen Motion Enhanced"
        unique_id: presencesensor3_motion_enhanced
        state: >
          {% if is_state('binary_sensor.presencesensor3_motion', 'on') %}
            Motion Detected
          {% elif is_state('binary_sensor.presencesensor3_motion', 'unavailable') %}
