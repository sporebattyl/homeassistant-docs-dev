# =============================================================================
# CLIMATE DASHBOARD ENHANCEMENTS - COMPREHENSIVE DASHBOARD SUPPORT
# =============================================================================
# Provides missing sensors and entities for the Climate Control Center dashboard
# to ensure full functionality across all 5 tabs:
# - Overview: Environmental intelligence and system status
# - Sensors: Enhanced sensor monitoring and analytics
# - Controls: Advanced occupancy intelligence
# - Emergency: Comprehensive safety status
# - Analytics: Complete energy and performance monitoring
# =============================================================================

homeassistant:
  customize:
    sensor.equipment_arbitration_effectiveness:
      friendly_name: "Equipment Arbitration Effectiveness"
      icon: mdi:cog-sync
    sensor.coordination_energy_performance_score:
      friendly_name: "Coordination Energy Performance Score"
      icon: mdi:chart-line-variant
    sensor.energy_aware_dehumidifier_priority:
      friendly_name: "Energy Aware Dehumidifier Priority"
      icon: mdi:water-percent-alert
    sensor.energy_aware_hvac_efficiency:
      friendly_name: "Energy Aware HVAC Efficiency"
      icon: mdi:air-conditioner
    binary_sensor.motion_follow_me_focus:
      friendly_name: "Motion Follow-Me Focus"
      icon: mdi:target-account
      device_class: motion

# Dashboard-specific sensors for Climate Control Center
template:
  - sensor:
      # =======================================================================
      # ENTITY NAME ALIASES - FIXES DASHBOARD "Entity not found" ERRORS
      # =======================================================================

      - name: "Average House Temperature Enhanced"
        unique_id: average_house_temperature_enhanced_alias
        unit_of_measurement: "°F"
        device_class: temperature
        state: >
          {% set source_value = states('sensor.average_house_temperature_combined') %}
          {% if source_value in ['unknown', 'unavailable', 'none'] %}
            {% set fallback_sensors = [
              'sensor.climate_living_room_temperature',
              'sensor.climate_laundry_room_temperature',
              'sensor.climate_guest_bedroom_temperature'
            ] %}
            {% set valid_temps = [] %}
            {% for sensor in fallback_sensors %}
              {% if states(sensor) not in ['unknown', 'unavailable', 'none'] %}
                {% set valid_temps = valid_temps + [states(sensor) | float] %}
              {% endif %}
            {% endfor %}
            {% if valid_temps | length > 0 %}
              {{ (valid_temps | sum / valid_temps | length) | round(1) }}
            {% else %}
              75.0
            {% endif %}
          {% else %}
            {{ source_value | float(75) }}
          {% endif %}
        availability: >
          {% set primary_available =
            not is_state('sensor.average_house_temperature_combined', 'unavailable') %}
          {% set fallback_available = not is_state('sensor.climate_living_room_temperature', 'unavailable') %}
          {{ primary_available or fallback_available }}
        attributes:
          sensor_count: >-
            {{ state_attr('sensor.average_house_temperature_combined', 'sensor_count')
               | default(15) }}
          integration_status: >-
            {{ state_attr('sensor.average_house_temperature_combined', 'integration_status')
               | default('Active') }}
          temperature_range: >-
            {{ state_attr('sensor.average_house_temperature_combined', 'temperature_range')
               | default('70-78°F') }}
          source_entity: "sensor.average_house_temperature_combined"

      - name: "Average House Humidity Enhanced"
        unique_id: average_house_humidity_enhanced_alias
        unit_of_measurement: "%"
        device_class: humidity
        state: >
          {% set source_value = states('sensor.average_house_humidity_combined') %}
          {% if source_value in ['unknown', 'unavailable', 'none'] %}
            {% set fallback_sensors = [
              'sensor.climate_living_room_humidity',
              'sensor.climate_laundry_room_humidity',
              'sensor.climate_outdoor_back_porch_humidity'
            ] %}
            {% set valid_humidity = [] %}
            {% for sensor in fallback_sensors %}
              {% if states(sensor) not in ['unknown', 'unavailable', 'none'] %}
                {% set valid_humidity = valid_humidity + [states(sensor) | float] %}
              {% endif %}
            {% endfor %}
            {% if valid_humidity | length > 0 %}
              {{ (valid_humidity | sum / valid_humidity | length) | round(0) }}
            {% else %}
              50
            {% endif %}
          {% else %}
            {{ source_value | float(50) | round(0) }}
          {% endif %}
        availability: >
          {% set primary_available = not is_state('sensor.average_house_humidity_combined', 'unavailable') %}
          {% set fallback_available = not is_state('sensor.climate_living_room_humidity', 'unavailable') %}
          {{ primary_available or fallback_available }}
        attributes:
          sensor_count: >-
            {{ state_attr('sensor.average_house_humidity_combined', 'sensor_count')
               | default(15) }}
          integration_status: >-
            {{ state_attr('sensor.average_house_humidity_combined', 'integration_status')
               | default('Active') }}
          humidity_range: >-
            {{ state_attr('sensor.average_house_humidity_combined', 'humidity_range')
               | default('45-60%') }}
          emergency_zone_count: >-
            {{ state_attr('sensor.average_house_humidity_combined', 'emergency_zone_count')
               | default(0) }}
          source_entity: "sensor.average_house_humidity_combined"

      # =======================================================================
      # ML14XC1 AIR CONDITIONER SENSORS - COMPREHENSIVE IMPLEMENTATION
      # =======================================================================

      - name: "ML14XC1 Status"
        unique_id: ml14xc1_status_dashboard
        state: >
          {% set hvac_action = state_attr('climate.thermostat', 'hvac_action') | default('idle') %}
          {% if hvac_action == 'cooling' %}
            Cooling Active
          {% elif hvac_action == 'heating' %}
            Heating Active
          {% elif hvac_action == 'fan' %}
            Fan Only
          {% elif hvac_action == 'idle' %}
            Standby
          {% else %}
            Offline
          {% endif %}
        icon: >
          {% set hvac_action = state_attr('climate.thermostat', 'hvac_action') | default('idle') %}
          {% if hvac_action == 'cooling' %}mdi:snowflake
          {% elif hvac_action == 'heating' %}mdi:fire
          {% else %}mdi:air-conditioner{% endif %}
        attributes:
          hvac_action: "{{ state_attr('climate.thermostat', 'hvac_action') | default('idle') }}"
          current_temperature: "{{ state_attr('climate.thermostat', 'current_temperature') | default(0) }}°F"
          target_temperature: "{{ state_attr('climate.thermostat', 'temperature') | default(0) }}°F"
          equipment_type: "Lennox ML14XC1 (14 SEER)"

      - name: "ML14XC1 Runtime Current"
        unique_id: ml14xc1_runtime_current_dashboard
        unit_of_measurement: "min"
        state: >
          {% if is_state('timer.hvac_runtime_monitor', 'active') %}
            {% set duration = state_attr('timer.hvac_runtime_monitor', 'duration') %}
            {% set remaining = state_attr('timer.hvac_runtime_monitor', 'remaining') %}
            {% if duration and remaining %}
              {% set duration_parts = duration.split(':') %}
              {% set remaining_parts = remaining.split(':') %}
              {% set duration_min = (duration_parts[0] | int * 60) + (duration_parts[1] | int) %}
              {% set remaining_min = (remaining_parts[0] | int * 60) + (remaining_parts[1] | int) %}
              {{ (duration_min - remaining_min) }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}
        attributes:
          daily_runtime_hours: "{{ states('sensor.ml14xc1_daily_runtime_hours') | float(0) | round(2, default=0) }}"
          max_runtime: "{{ states('input_number.hvac_max_runtime_summer') | default(45) }} minutes"
          runtime_efficiency: >
            {% set runtime = states('sensor.ml14xc1_daily_runtime_hours') | float(0) %}
            {% if runtime < 2 %}Low Usage
            {% elif runtime < 5 %}Moderate Usage
            {% elif runtime < 8 %}High Usage
            {% else %}Very High Usage{% endif %}

      - name: "ML14XC1 Protection Status"
        unique_id: ml14xc1_protection_status_dashboard
        state: >
          {% set hvac_action = state_attr('climate.thermostat', 'hvac_action') | default('idle') %}
          {% set runtime = states('sensor.ml14xc1_daily_runtime_hours') | float(0) * 60 %}
          {% set max_runtime = states('input_number.hvac_max_runtime_summer') | float(45) %}
          {% if runtime > max_runtime and hvac_action in ['cooling', 'heating'] %}
            Runtime Protection Active
          {% elif is_state('input_boolean.hvac_emergency_override', 'on') %}
            Emergency Override Active
          {% else %}
            Normal Operation
          {% endif %}
        icon: >
          {% set runtime = states('sensor.ml14xc1_daily_runtime_hours') | float(0) * 60 %}
          {% set max_runtime = states('input_number.hvac_max_runtime_summer') | float(45) %}
          {% if runtime > max_runtime %}mdi:shield-alert
          {% else %}mdi:shield-check{% endif %}

      - name: "ML14XC1 SEER Rating"
        unique_id: ml14xc1_seer_rating_dashboard
        state: "14"
        unit_of_measurement: "SEER"
        attributes:
          equipment_model: "Lennox ML14XC1"
          efficiency_class: "Standard Efficiency"
          gulf_coast_optimized: true

      - name: "ML14XC1 Daily Cost"
        unique_id: ml14xc1_daily_cost_dashboard
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set runtime_hours = states('sensor.ml14xc1_daily_runtime_hours') | float(0) %}
          {% set power_kw = 3.5 %}  {# ML14XC1 estimated draw #}
          {% set electricity_rate_cents = states('input_number.electricity_rate') | float(18.0) %}
          {% set cost_per_kwh = electricity_rate_cents / 100 %}
          {% set energy_used = runtime_hours * power_kw %}
          {{ (energy_used * cost_per_kwh) | round(2, default=0) }}
        attributes:
          runtime_hours: "{{ states('sensor.ml14xc1_daily_runtime_hours') | float(0) | round(2, default=0) }}"
          energy_used_kwh: "{{ (states('sensor.ml14xc1_daily_runtime_hours') | float(0) * 3.5) | round(2, default=0) }}"
          cost_per_kwh: "${{ (states('input_number.electricity_rate') | float(18.0) / 100) | round(3) }}"
          electricity_rate: "{{ states('input_number.electricity_rate') }}¢/kWh"

      - name: "ML14XC1 Efficiency Score"
        unique_id: ml14xc1_efficiency_score_dashboard
        unit_of_measurement: "%"
        state: >
          {% set current_temp = states('sensor.average_house_temperature_combined') | float(75) %}
          {% set target_temp = state_attr('climate.thermostat', 'temperature') | float(74) %}
          {% set temp_delta = (current_temp - target_temp) | abs %}
          {% if temp_delta <= 0.5 %}
            95
          {% elif temp_delta <= 1.0 %}
            90
          {% elif temp_delta <= 2.0 %}
            80
          {% else %}
            70
          {% endif %}

      - name: "ML14XC1 Next Maintenance"
        unique_id: ml14xc1_next_maintenance_dashboard
        state: >
          {% set last_service = states('input_datetime.hvac_last_professional_service') %}
          {% if last_service in ['unknown', 'unavailable', 'none'] %}
            {% set last_service = '2024-03-01' %}
          {% endif %}
          {% set service_date = strptime(last_service, '%Y-%m-%d') %}
          {% set next_service = service_date + timedelta(days=180) %}
          {{ next_service.strftime('%B %d, %Y') }}
        attributes:
          days_until_service: >
            {% set last_service = states('input_datetime.hvac_last_professional_service') %}
            {% if last_service in ['unknown', 'unavailable', 'none'] %}
              {% set last_service = '2024-03-01' %}
            {% endif %}
            {% set service_date = strptime(last_service, '%Y-%m-%d') %}
            {% set next_service = service_date + timedelta(days=180) %}
            {% set days_left = (next_service.date() - now().date()).days %}
            {{ days_left if days_left > 0 else 0 }}
          service_interval: "6 months"

      - name: "ML14XC1 Filter Status"
        unique_id: ml14xc1_filter_status_dashboard
        state: >
          {% set last_change = states('input_datetime.hvac_filter_last_changed') %}
          {% if last_change in ['unknown', 'unavailable', 'none'] %}
            {% set last_change = '2024-09-01' %}
          {% endif %}
          {% set change_date = strptime(last_change, '%Y-%m-%d').date() %}
          {% set days_since = (now().date() - change_date).days %}
          {% if days_since > 90 %}
            Overdue
          {% elif days_since > 75 %}
            Due Soon
          {% else %}
            Good
          {% endif %}
        attributes:
          days_since_change: >
            {% set last_change = states('input_datetime.hvac_filter_last_changed') %}
            {% if last_change in ['unknown', 'unavailable', 'none'] %}
              {% set last_change = '2024-09-01' %}
            {% endif %}
            {% set change_date = strptime(last_change, '%Y-%m-%d').date() %}
            {{ (now().date() - change_date).days }}
          recommended_interval: "3 months"

  - trigger:
      - platform: state
        entity_id: timer.hvac_runtime_monitor
    sensor:
      - name: "ML14XC1 Last Cycle Minutes"
        unique_id: ml14xc1_last_cycle_minutes_dashboard
        unit_of_measurement: "min"
        icon: mdi:timer-outline
        state_class: measurement
        state: >-
          {% set invalid = ['unknown', 'unavailable', '', None] %}
          {% set previous = states('sensor.ml14xc1_last_cycle_minutes') %}
          {% set previous = 0 if previous in invalid else previous | float %}
          {% if trigger is not defined %}
            {{ previous }}
          {% else %}
            {% set to_state = trigger.to_state.state if trigger.to_state else states('timer.hvac_runtime_monitor') %}
            {% set from_state = trigger.from_state.state if trigger.from_state else None %}
            {% if to_state == 'active' %}
              0
            {% elif to_state == 'idle' and from_state == 'active' and trigger.from_state %}
              {% set duration = trigger.from_state.attributes.duration %}
              {% set remaining = trigger.from_state.attributes.remaining %}
              {% if duration %}
                {% set duration_parts = duration.split(':') %}
                {% if duration_parts | length == 3 %}
                  {% set duration_sec =
                    (duration_parts[0] | int * 3600) + (duration_parts[1] | int * 60) +
                    (duration_parts[2] | int) %}
                {% elif duration_parts | length == 2 %}
                  {% set duration_sec = (duration_parts[0] | int * 60) + (duration_parts[1] | int) %}
                {% else %}
                  {% set duration_sec = duration_parts[0] | int %}
                {% endif %}
                {% set remaining_parts = (remaining.split(':')) if remaining else ['0', '0', '0'] %}
                {% if remaining_parts | length == 3 %}
                  {% set remaining_sec =
                    (remaining_parts[0] | int * 3600) + (remaining_parts[1] | int * 60) +
                    (remaining_parts[2] | int) %}
                {% elif remaining_parts | length == 2 %}
                  {% set remaining_sec = (remaining_parts[0] | int * 60) + (remaining_parts[1] | int) %}
                {% else %}
                  {% set remaining_sec = remaining_parts[0] | int %}
                {% endif %}
                {% set elapsed_sec = duration_sec - remaining_sec %}
                {% if elapsed_sec < 0 %}{% set elapsed_sec = 0 %}{% endif %}
                {{ (elapsed_sec / 60) | round(1) }}
              {% else %}
                {{ previous }}
              {% endif %}
            {% else %}
              {{ previous }}
            {% endif %}
          {% endif %}
        attributes:
          cycle_completed: >-
            {% if trigger is defined and trigger.to_state and trigger.to_state.state == 'idle' and
                  trigger.from_state and trigger.from_state.state == 'active' %}
              {{ now().isoformat() }}
            {% else %}
              {{ state_attr('sensor.ml14xc1_last_cycle_minutes', 'cycle_completed') }}
            {% endif %}
          timer_remaining: >-
            {% if trigger is defined and trigger.from_state %}
              {{ trigger.from_state.attributes.remaining }}
            {% else %}
              {{ state_attr('timer.hvac_runtime_monitor', 'remaining') }}
            {% endif %}
          source: >-
            {% if trigger is defined and trigger.to_state and trigger.to_state.state == 'idle' and
                  trigger.from_state and trigger.from_state.state == 'active' %}
              timer_stopped
            {% elif trigger is defined and trigger.to_state and trigger.to_state.state == 'active' %}
              timer_started
            {% else %}
              cached
            {% endif %}


      # =======================================================================
      # E130 DEHUMIDIFIER SENSORS - COMPREHENSIVE IMPLEMENTATION
      # =======================================================================

      - name: "E130 Status"
        unique_id: e130_status_dashboard
        state: >
          {% if is_state('switch.dehumidifier_relay_l1', 'on') %}
            Active - Dehumidifying
          {% elif is_state('switch.dehumidifier_relay_l1', 'off') %}
            Standby
          {% else %}
            Offline
          {% endif %}
        icon: >
          {% if is_state('switch.dehumidifier_relay_l1', 'on') %}
            mdi:air-humidifier
          {% else %}
            mdi:air-humidifier-variant
          {% endif %}
        attributes:
          switch_state: "{{ states('switch.dehumidifier_relay_l1') }}"
          current_humidity: "{{ states('sensor.average_house_humidity_combined') }}%"
          target_humidity: "{{ states('input_number.humidity_target') }}%"
          equipment_type: "Aprilaire E130"

      - name: "E130 Last Runtime"
        unique_id: e130_last_runtime_dashboard
        unit_of_measurement: "min"
        state: >
          {% if is_state('timer.dehumidifier_runtime_monitor', 'active') %}
            {% set duration = state_attr('timer.dehumidifier_runtime_monitor', 'duration') %}
            {% set remaining = state_attr('timer.dehumidifier_runtime_monitor', 'remaining') %}
            {% if duration and remaining %}
              {% set duration_parts = duration.split(':') %}
              {% set remaining_parts = remaining.split(':') %}
              {% set duration_min = (duration_parts[0] | int * 60) + (duration_parts[1] | int) %}
              {% set remaining_min = (remaining_parts[0] | int * 60) + (remaining_parts[1] | int) %}
              {{ (duration_min - remaining_min) }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}
        attributes:
          max_runtime: "{{ states('input_number.dehumidifier_max_runtime') | default(45) }} minutes"
          cooldown_period: "{{ states('input_number.dehumidifier_cooldown') | default(10) }} minutes"
          runtime_efficiency: >
            {% set humidity = states('sensor.average_house_humidity_combined') | float(50) %}
            {% if humidity < 50 %}Excellent
            {% elif humidity < 55 %}Good
            {% else %}Working Hard{% endif %}

  - trigger:
      - platform: state
        entity_id: timer.dehumidifier_runtime_monitor
    sensor:
      - name: "E130 Last Cycle Minutes"
        unique_id: e130_last_cycle_minutes_dashboard
        unit_of_measurement: "min"
        icon: mdi:timer-sand
        state_class: measurement
        state: >-
          {% set invalid = ['unknown', 'unavailable', '', None] %}
          {% set previous = states('sensor.e130_last_cycle_minutes') %}
          {% set previous = 0 if previous in invalid else previous | float %}
          {% if trigger is not defined %}
            {{ previous }}
          {% else %}
            {% set to_state =
              trigger.to_state.state if trigger.to_state
              else states('timer.dehumidifier_runtime_monitor') %}
            {% set from_state = trigger.from_state.state if trigger.from_state else None %}
            {% if to_state == 'active' %}
              0
            {% elif to_state == 'idle' and from_state == 'active' and trigger.from_state %}
              {% set duration = trigger.from_state.attributes.duration %}
              {% set remaining = trigger.from_state.attributes.remaining %}
              {% if duration %}
                {% set duration_parts = duration.split(':') %}
                {% if duration_parts | length == 3 %}
                  {% set duration_sec =
                    (duration_parts[0] | int * 3600) + (duration_parts[1] | int * 60) +
                    (duration_parts[2] | int) %}
                {% elif duration_parts | length == 2 %}
                  {% set duration_sec = (duration_parts[0] | int * 60) + (duration_parts[1] | int) %}
                {% else %}
                  {% set duration_sec = duration_parts[0] | int %}
                {% endif %}
                {% set remaining_parts = (remaining.split(':')) if remaining else ['0', '0', '0'] %}
                {% if remaining_parts | length == 3 %}
                  {% set remaining_sec =
                    (remaining_parts[0] | int * 3600) + (remaining_parts[1] | int * 60) +
                    (remaining_parts[2] | int) %}
                {% elif remaining_parts | length == 2 %}
                  {% set remaining_sec = (remaining_parts[0] | int * 60) + (remaining_parts[1] | int) %}
                {% else %}
                  {% set remaining_sec = remaining_parts[0] | int %}
                {% endif %}
                {% set elapsed_sec = duration_sec - remaining_sec %}
                {% if elapsed_sec < 0 %}{% set elapsed_sec = 0 %}{% endif %}
                {{ (elapsed_sec / 60) | round(1) }}
              {% else %}
                {{ previous }}
              {% endif %}
            {% else %}
              {{ previous }}
            {% endif %}
          {% endif %}
        attributes:
          cycle_completed: >-
            {% if trigger is defined and trigger.to_state and trigger.to_state.state == 'idle' and
                  trigger.from_state and trigger.from_state.state == 'active' %}
              {{ now().isoformat() }}
            {% else %}
              {{ state_attr('sensor.e130_last_cycle_minutes', 'cycle_completed') }}
            {% endif %}
          timer_remaining: >-
            {% if trigger is defined and trigger.from_state %}
              {{ trigger.from_state.attributes.remaining }}
            {% else %}
              {{ state_attr('timer.dehumidifier_runtime_monitor', 'remaining') }}
            {% endif %}
          source: >-
            {% if trigger is defined and trigger.to_state and trigger.to_state.state == 'idle' and
                  trigger.from_state and trigger.from_state.state == 'active' %}
              timer_stopped
            {% elif trigger is defined and trigger.to_state and trigger.to_state.state == 'active' %}
              timer_started
            {% else %}
              cached
            {% endif %}

      - name: "E130 Protection Status"
        unique_id: e130_protection_status_dashboard
        state: >
          {% set outdoor_temp = states('weather.home') | default('unknown') %}
          {% set temp_attr = state_attr('weather.home', 'temperature') %}
          {% if temp_attr == None %}
            {% set temp_attr = 70 %}
          {% endif %}
          {% if temp_attr | float(70) < 32 %}
            Freeze Protection Active
          {% elif is_state('input_boolean.hvac_emergency_override', 'on') %}
            Emergency Override Active
          {% else %}
            Normal Operation
          {% endif %}
        icon: >
          {% set temp_attr = state_attr('weather.home', 'temperature') %}
          {% if temp_attr == None %}
            {% set temp_attr = 70 %}
          {% endif %}
          {% if temp_attr | float(70) < 32 %}mdi:snowflake-alert
          {% else %}mdi:shield-check{% endif %}

      - name: "E130 Filter Life"
        unique_id: e130_filter_life_dashboard
        unit_of_measurement: "%"
        state: >
          {% set last_change = states('input_datetime.dehumidifier_filter_last_changed') %}
          {% if last_change in ['unknown', 'unavailable', 'none'] %}
            {% set last_change = '2024-09-01' %}
          {% endif %}
          {% set change_date = strptime(last_change, '%Y-%m-%d').date() %}
          {% set days_since = (now().date() - change_date).days %}
          {% set life_remaining = 100 - ((days_since / 180) * 100) %}
          {{ life_remaining | round(0, default=0) if life_remaining > 0 else 0 }}
        attributes:
          days_since_change: >
            {% set last_change = states('input_datetime.dehumidifier_filter_last_changed') %}
            {% if last_change in ['unknown', 'unavailable', 'none'] %}
              {% set last_change = '2024-09-01' %}
            {% endif %}
            {% set change_date = strptime(last_change, '%Y-%m-%d').date() %}
            {{ (now().date() - change_date).days }}
          recommended_interval: "6 months"

      - name: "E130 Daily Cost"
        unique_id: e130_daily_cost_dashboard
        unit_of_measurement: "$"
        device_class: monetary
        state_class: total
        state: >
          {% set runtime_hours = states('sensor.e130_daily_runtime_hours') | float(0) %}
          {% set power_kw = 0.8 %}  {# AprilAire E130 nominal draw #}
          {% set electricity_rate_cents = states('input_number.electricity_rate') | float(18.0) %}
          {% set cost_per_kwh = electricity_rate_cents / 100 %}
          {% set energy_used = runtime_hours * power_kw %}
          {{ (energy_used * cost_per_kwh) | round(2, default=0) }}
        attributes:
          runtime_hours: "{{ states('sensor.e130_daily_runtime_hours') | float(0) | round(2, default=0) }}"
          energy_used_kwh: "{{ (states('sensor.e130_daily_runtime_hours') | float(0) * 0.8) | round(2, default=0) }}"
          cost_per_kwh: "${{ (states('input_number.electricity_rate') | float(18.0) / 100) | round(3) }}"
          electricity_rate: "{{ states('input_number.electricity_rate') }}¢/kWh"

      - name: "E130 Efficiency Score"
        unique_id: e130_efficiency_score_dashboard
        unit_of_measurement: "%"
        state: >
          {% set current_humidity = states('sensor.average_house_humidity_combined') | float(55) %}
          {% set target_humidity = states('input_number.humidity_target') | float(50) %}
          {% if current_humidity <= target_humidity %}
            100
          {% elif current_humidity <= target_humidity + 3 %}
            90
          {% elif current_humidity <= target_humidity + 5 %}
            80
